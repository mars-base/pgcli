---
# Usage:
#   cd ansible
#   uv run ansible-playbook playbooks/resources.yaml
#   uv run ansible-playbook playbooks/resources.yaml -l addon_nodeexporter_single
#   uv run ansible-playbook playbooks/resources.yaml -e HOSTS=debian12-01
#
# Shows live host resources (CPU, load, memory, swap, filesystems and the top
# memory consumers) plus the pgcli version and, for every namespace in
# pgcli_namespaces, its configured instances, installed add-ons and Patroni
# cluster status. Only hosts that carry the pgcli binary at pgcli_install_path
# are reported; other selected hosts are skipped with a short message. Override
# the path with -e pgcli_install_path=/path/to/pg if it is installed elsewhere.

- name: Host and pgcli resources
  hosts: "{{ HOSTS | default('all') }}"
  gather_facts: false

  pre_tasks:
    - name: Resolve the rootless deployment environment
      ansible.builtin.include_role:
        name: pgcli
        tasks_from: deploy-env
      when: pgcli_deploy_rootless | bool

  # pgcli and podman run under the deployment account: root for the default
  # layout, the unprivileged account for [rootless]/[rootless_ha] hosts. Running
  # `pg` as the SSH account would not see the rootless containers.
  become: true
  become_user: "{{ pgcli_deploy_become_user }}"
  module_defaults:
    ansible.builtin.command:
      chdir: "{{ pgcli_deploy_home }}"
    ansible.builtin.shell:
      chdir: "{{ pgcli_deploy_home }}"
  environment: "{{ pgcli_deploy_env }}"

  tasks:
    - name: Check for the pgcli binary
      ansible.builtin.stat:
        path: "{{ pgcli_install_path }}"
      register: _resources_pgcli_bin

    - name: Skip hosts without pgcli
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: pgcli not found at {{ pgcli_install_path }}; skipped"
      when: not _resources_pgcli_bin.stat.exists

    - name: Collect host resources
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          printf 'host: %s\n' "$(hostname)"
          printf 'kernel: %s\n' "$(uname -srm)"
          printf 'uptime: %s\n' "$(uptime -p 2>/dev/null || uptime)"
          printf 'cpu: %s vCPU\n' "$(nproc)"
          printf 'load: %s\n' "$(awk '{printf "%s, %s, %s\n", $1, $2, $3}' /proc/loadavg)"
          printf 'memory: %s\n' "$(free -h | awk '/^Mem:/{printf "total %s, used %s, available %s\n", $2, $3, $7}')"
          printf 'swap: %s\n' "$(free -h | awk '/^Swap:/{printf "total %s, used %s, free %s\n", $2, $3, $4}')"
          printf 'filesystems:\n'
          df -hP -x tmpfs -x devtmpfs -x overlay -x squashfs
          printf 'top memory processes:\n'
          ps -eo pid,comm,%cpu,%mem --sort=-%mem | head -n 6
        executable: /bin/bash
      register: _resources_host
      changed_when: false
      when: _resources_pgcli_bin.stat.exists

    - name: Read the pgcli version
      ansible.builtin.command:
        argv:
          - "{{ pgcli_install_path }}"
          - "--version"
      register: _resources_version
      changed_when: false
      failed_when: false
      when: _resources_pgcli_bin.stat.exists

    - name: Check namespace config files
      ansible.builtin.stat:
        path: "{{ (item.path | regex_replace('/+$', '')) ~ '/pg.yaml' }}"
      loop: >-
        {{ (pgcli_namespaces | default([]) | selectattr('path', 'defined') | selectattr('path', 'ne', '') | list)
           or [{'name': pgcli_config.namespace | default('default'),
                'path': pgcli_config_path | dirname}] }}
      loop_control:
        label: "{{ item.name }}"
      register: _resources_namespace_configs
      when: _resources_pgcli_bin.stat.exists

    - name: Read per-namespace resources
      ansible.builtin.shell:
        cmd: |
          printf 'instances:\n'
          {{ pgcli_install_path | quote }} -c {{ _resources_cfg | quote }} list 2>&1 || true
          printf '\nadd-ons:\n'
          {{ pgcli_install_path | quote }} -c {{ _resources_cfg | quote }} addon list 2>&1 || true
          printf '\nha:\n'
          {{ pgcli_install_path | quote }} -c {{ _resources_cfg | quote }} ha status 2>&1 || true
        executable: /bin/bash
      vars:
        _resources_cfg: "{{ (item.item.path | regex_replace('/+$', '')) ~ '/pg.yaml' }}"
      loop: "{{ _resources_namespace_configs.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      register: _resources_namespace_output
      changed_when: false
      failed_when: false
      when:
        - _resources_pgcli_bin.stat.exists
        - item.stat.exists

    - name: Normalize the pgcli output
      ansible.builtin.set_fact:
        _resources_version_text: >-
          {{ (_resources_version.stdout | trim)
             if (_resources_version.stdout | trim | length > 0)
             else (_resources_version.stderr | trim | default('unknown', true)) }}
        _resources_namespaces_text: >-
          {%- set ns = namespace(text='') -%}
          {%- for result in _resources_namespace_output.results if not (result.skipped | default(false)) -%}
            {%- set cfg = (result.item.item.path | regex_replace('/+$', '')) ~ '/pg.yaml' -%}
            {%- set ns.text = ns.text ~ (('\n\n' if not loop.first else '') ~ 'namespace: ' ~ result.item.item.name ~ ' (' ~ cfg ~ ')' ~ '\n' ~ (result.stdout | trim)) -%}
          {%- endfor -%}
          {%- set missing = [] -%}
          {%- for result in _resources_namespace_configs.results if not result.stat.exists -%}
            {%- set _ = missing.append(result.item.name) -%}
          {%- endfor -%}
          {%- if missing | length > 0 -%}
            {%- set ns.text = ns.text ~ '\n\nnot initialized: ' ~ (missing | join(', ')) -%}
          {%- endif -%}
          {{ ns.text }}
      when: _resources_pgcli_bin.stat.exists

    - name: Show the resource report
      ansible.builtin.debug:
        msg:
          - "{{ _resources_host.stdout }}"
          - "pgcli: {{ _resources_version_text }}"
          - "namespaces:"
          - "{{ _resources_namespaces_text }}"
      when: _resources_pgcli_bin.stat.exists
