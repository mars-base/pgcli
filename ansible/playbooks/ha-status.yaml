---
# Usage:
#   cd ansible
#   uv run ansible-playbook playbooks/ha-status.yaml
#   uv run ansible-playbook playbooks/ha-status.yaml -l ha_cluster
#   uv run ansible-playbook playbooks/ha-status.yaml -l debian12-02
#
# --limit accepts the ha_cluster group or any single host in it (any selected
# host may read the shared DCS view). Without --limit the whole group is
# targeted.
#
# Prints the live Patroni topology (role, state, LSN, lag) for every cluster
# declared in pg_ha_clusters, followed by the HAProxy instances in front of
# them (mode, read-write/read-only/stats endpoints, backends). The command runs
# once on the first host in the play: all members share the same etcd DCS, so
# any one of them returns the same cluster view. Proxy details are read on
# pg_ha_haproxy_host.

- name: Patroni HA status
  hosts: ha_cluster
  gather_facts: false

  pre_tasks:
    - name: Resolve the rootless deployment environment
      ansible.builtin.include_role:
        name: pgcli
        tasks_from: deploy-env
      when: pgcli_deploy_rootless | bool

  # pgcli and podman run under the deployment account: root for the default
  # layout, the unprivileged account for [rootless_ha] hosts. Running `pg` as
  # the SSH account would report the rootless containers as stopped.
  become: true
  become_user: "{{ pgcli_deploy_become_user }}"
  module_defaults:
    ansible.builtin.command:
      chdir: "{{ pgcli_deploy_home }}"
    ansible.builtin.shell:
      chdir: "{{ pgcli_deploy_home }}"
  environment: "{{ pgcli_deploy_env }}"

  tasks:
    - name: Read the status of every HA cluster
      ansible.builtin.shell: >-
        {{ pgcli_install_path }} -c {{ _ha_status_cfg }} ha status {{ item.scope }}
      loop: "{{ pg_ha_clusters }}"
      loop_control:
        label: "{{ item.namespace | default('-') }}/{{ item.scope }}"
      vars:
        _ha_status_ns: >-
          {{ (pgcli_namespaces | default([]) | selectattr('name', 'equalto', item.namespace | default('', true))
              | list | first | default({}))
             if (item.namespace | default('', true) | length > 0) else {} }}
        _ha_status_cfg: >-
          {{ ((_ha_status_ns.path | regex_replace('/+$', '')) ~ '/pg.yaml')
             if (item.namespace | default('', true) | length > 0) else pgcli_config_path }}
      register: _ha_status
      changed_when: false
      run_once: true

    - name: Show the status tables
      ansible.builtin.debug:
        msg: "{{ item.stdout }}"
      loop: "{{ _ha_status.results }}"
      loop_control:
        label: "{{ item.item.namespace | default('-') }}/{{ item.item.scope }}"
      run_once: true

    - name: Read the proxies in front of every cluster
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          {{ pgcli_install_path }} -c {{ _ha_proxy_cfg }} addon list \
            | awk '/^Infra add-ons \(haproxy\):/{f=1}
                   f && /^[^ ]/ && !/^Infra add-ons \(haproxy\):/{exit}
                   f'
        executable: /bin/bash
      loop: "{{ (pg_ha_haproxy | default({})).clusters | default([]) }}"
      loop_control:
        label: "{{ item.namespace | default('-') }}/{{ item.name | default('lb') }}"
      vars:
        _ha_proxy_ns: >-
          {{ (pgcli_namespaces | default([]) | selectattr('name', 'equalto', item.namespace | default('', true))
              | list | first | default({}))
             if (item.namespace | default('', true) | length > 0) else {} }}
        _ha_proxy_cfg: >-
          {{ ((_ha_proxy_ns.path | regex_replace('/+$', '')) ~ '/pg.yaml')
             if (item.namespace | default('', true) | length > 0) else pgcli_config_path }}
      register: _ha_proxy_status
      changed_when: false
      run_once: true
      delegate_to: "{{ pg_ha_haproxy_host | default(groups['ha_cluster'] | first) }}"
      when: (pg_ha_haproxy | default({})).enabled | default(false) | bool

    - name: Show the proxy details
      ansible.builtin.debug:
        msg: "{{ item.stdout if item.stdout | length > 0 else '(no HAProxy instance)' }}"
      loop: "{{ _ha_proxy_status.results | default([]) }}"
      loop_control:
        label: "{{ item.item.namespace | default('-') }}/{{ item.item.name | default('lb') }} @ {{ pg_ha_haproxy_host | default(groups['ha_cluster'] | first) }}"
      run_once: true
      when: (pg_ha_haproxy | default({})).enabled | default(false) | bool
