---
# Usage (ANSIBLE_LOG_PATH is REQUIRED — see below):
#   cd ansible
#   ANSIBLE_LOG_PATH=/dev/null uv run ansible-playbook playbooks/passwords.yaml
#   ANSIBLE_LOG_PATH=/dev/null uv run ansible-playbook playbooks/passwords.yaml -e HOSTS=debian12-01
#   ANSIBLE_LOG_PATH=/dev/null uv run ansible-playbook playbooks/passwords.yaml -e HOSTS=ha_cluster
#
# Prints, for every namespace in pgcli_namespaces on the selected hosts:
#   - each instance's admin DSN (from `pg status -i <instance>`),
#   - each Patroni HA cluster's stored password set (`pg ha passwords <scope>`),
#   - the installed add-ons with their stored credentials
#     (`pg addon list --show-password`).
#
# The output is plaintext credentials. ansible.cfg sets log_path =
# var/ansible.log, which would persist everything printed here, so this
# playbook refuses to run unless ANSIBLE_LOG_PATH=/dev/null. Do not redirect
# its stdout to a file; prefer piping into a 0600 file or a password manager on
# the controller when you need to keep a copy.

- name: Show pgcli credentials
  hosts: "{{ HOSTS | default('all') }}"
  gather_facts: false

  tasks:
    - name: Require Ansible logging to be disabled
      ansible.builtin.assert:
        that:
          - lookup('env', 'ANSIBLE_LOG_PATH') == '/dev/null'
        fail_msg: >-
          Refusing to print credentials with Ansible logging enabled. Re-run as
          ANSIBLE_LOG_PATH=/dev/null uv run ansible-playbook playbooks/passwords.yaml
      run_once: true
      tags: [always]

    - name: Check for the pgcli binary
      ansible.builtin.stat:
        path: "{{ pgcli_install_path }}"
      register: _passwords_pgcli_bin

    - name: Skip hosts without pgcli
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: pgcli not found at {{ pgcli_install_path }}; skipped"
      when: not _passwords_pgcli_bin.stat.exists

    - name: Check namespace config files
      ansible.builtin.stat:
        path: "{{ (item.path | regex_replace('/+$', '')) ~ '/pg.yaml' }}"
      loop: >-
        {{ (pgcli_namespaces | default([]) | selectattr('path', 'defined') | selectattr('path', 'ne', '') | list)
           or [{'name': pgcli_config.namespace | default('default'),
                'path': pgcli_config_path | dirname}] }}
      loop_control:
        label: "{{ item.name }}"
      register: _passwords_namespaces
      when: _passwords_pgcli_bin.stat.exists

    - name: Collect credentials per namespace
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pg={{ pgcli_install_path | quote }}
          cfg={{ _passwords_cfg | quote }}

          printf 'instances (admin DSN):\n'
          instances=$("$pg" -c "$cfg" list 2>&1 | awk 'NR > 1 && $1 ~ /^[a-z0-9_]+$/ {print $1}')
          if [ -z "$instances" ]; then
            printf '  (none)\n'
          else
            printf '%s\n' "$instances" | while read -r inst; do
              printf '  %s\n' "$inst"
              "$pg" -c "$cfg" status -i "$inst" 2>&1 | sed -n 's/^  Connection: /    connection: /p'
            done
          fi

          printf '\nha clusters (stored password set):\n'
          scopes=$("$pg" -c "$cfg" ha list 2>&1 | awk 'NR > 1 && $1 != "SCOPE" && $1 ~ /^[A-Za-z0-9_-]+$/ {print $1}')
          if [ -z "$scopes" ]; then
            printf '  (none)\n'
          else
            printf '%s\n' "$scopes" | while read -r scope; do
              printf '  %s\n' "$scope"
              "$pg" -c "$cfg" ha passwords "$scope" 2>&1 | sed 's/^/    /'
            done
          fi

          printf '\nadd-ons (stored credentials):\n'
          "$pg" -c "$cfg" addon list --show-password 2>&1 || true
        executable: /bin/bash
      vars:
        _passwords_cfg: "{{ (item.item.path | regex_replace('/+$', '')) ~ '/pg.yaml' }}"
      loop: "{{ _passwords_namespaces.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      register: _passwords_output
      changed_when: false
      failed_when: false
      when:
        - _passwords_pgcli_bin.stat.exists
        - item.stat.exists

    - name: Show the credential report
      ansible.builtin.debug:
        msg: >-
          {%- set ns = namespace(text='') -%}
          {%- for result in _passwords_output.results if not (result.skipped | default(false)) -%}
            {%- set cfg = (result.item.item.path | regex_replace('/+$', '')) ~ '/pg.yaml' -%}
            {%- set ns.text = ns.text ~ (('\n\n' if not loop.first else '') ~ 'namespace: ' ~ result.item.item.name ~ ' (' ~ cfg ~ ')' ~ '\n' ~ (result.stdout | trim)) -%}
          {%- endfor -%}
          {{ ns.text }}
      when: _passwords_pgcli_bin.stat.exists
