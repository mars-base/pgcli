---
# Deploy a standalone S3-compatible object store for the pgBackRest `s3`
# backup target. Supports the three pgcli-managed stores: minio, silo and
# rustfs.
#
# The layout is derived from the number of nodes selected by pgcli_s3_nodes
# (default: the host's active store-type group, e.g. [silo_s3]) and
# pgcli_s3_drives. The store type is taken from the group name
# ([silo_s3] → silo); pgcli_s3_type is optional and must agree when set.
#
# pgcli_s3_nodes selects the subset of the store group that forms this
# deployment: one host for SNSD/SNMD, several for MNSD/MNMD. Pass a single
# name or a comma-separated pattern, e.g.
#   -e pgcli_s3_nodes=debian12-01
#   -e pgcli_s3_nodes=debian12-01,debian12-02,debian12-03,debian12-04
# Omit it to target the whole pgcli_s3_group.
#
#   hosts | drives | mode | pgcli flags per node
#   1     | 0      | SNSD | --data-dir
#   1     | N      | SNMD | --drive x N
#   >1    | 0      | MNSD | --data-dir + one --endpoint per node (minio/silo)
#   >1    | N      | MNMD | --drive x N + one --endpoint per node per drive
#
# rustfs has no MNSD: a multi-node rustfs grid needs --drive on every node and
# one --endpoint per node (no path; rustfs derives its drive slots itself).
#
# Cluster mode (MNSD/MNMD): every node receives the same --endpoint matrix
# (built in inventory order, private_ip preferred over ansible_host) and the
# same root password (pgcli_s3_root_password, e.g. in the active group's
# group_vars/<group>/secrets.yaml), and --listen must not be loopback. Set
# pgcli_s3_endpoints explicitly to override the derived matrix.
#
# TLS: single-node stores use pgcli's generated CA (--tls). A multi-host grid
# needs ONE certificate shared by every node (separate self-signed CAs cannot
# handshake), so the play generates a shared self-signed leaf on the
# controller (SANs cover every store host plus 127.0.0.1/localhost) under
# ansible/var/s3-tls/<name>/ and distributes it as
# <base>/tls/<type>/<name>/{grid.crt,grid.key}, publishing it as ca.crt too so
# the pg_instance role's normal CA copy keeps working. Pass
# pgcli_s3_tls_cert/pgcli_s3_tls_key (controller paths) to bring your own
# pair. Replacing the pair recreates the container (--force) automatically.
#
# Usage:
#   cd ansible
#   uv run ansible-playbook playbooks/deploy-s3.yaml
#   uv run ansible-playbook playbooks/deploy-s3.yaml -e pgcli_s3_group=minio_s3
#   uv run ansible-playbook playbooks/deploy-s3.yaml -e pgcli_s3_nodes=debian12-01
#   uv run ansible-playbook playbooks/deploy-s3.yaml -e pgcli_s3_nodes=debian12-01,debian12-02,debian12-03,debian12-04
#   uv run ansible-playbook playbooks/deploy-s3.yaml -e pgcli_s3_type=rustfs
#   uv run ansible-playbook playbooks/deploy-s3.yaml -e pgcli_s3_force=true
#
# The play targets pgcli_s3_group (default the [s3] parent group, whose only
# active child is the store-type group under test); override the variable to
# target a different group directly.
#
# After the store is up, database hosts using backup_target: s3 pick it up
# from inventory (see group_vars/crosshost/main.yml):
#   pgcli_backup_s3_host: <inventory host of one store node>
#   pgcli_backup_s3_port: <api-port>
#   pgcli_backup_s3_bucket / _access_key, secret in secrets.yaml
# The pg_instance role resolves <private_ip>:<port>, copies the store CA from
# <base>/tls/<type>/<name>/ca.crt (no manual fetch-ca or fingerprint step),
# and runs `pg backup setup` automatically before creating the instance.
# Stores outside this inventory can set pgcli_backup_s3_endpoint instead and
# fall back to `pg backup fetch-ca`.
#
# The work lives in roles/pg_s3: group.yml (resolve the active store group),
# shared_tls.yml (controller-side certificate), settings/validate/host_tls/
# install (main.yml) and buckets.yml (post-install bucket setup and endpoint
# summary). Activate exactly one store-type group in the inventory's [s3]
# children; the play targets pgcli_s3_group (default s3) and the role narrows
# each host to the store-type group it actually belongs to.

- name: Install and configure pgcli
  hosts: "{{ pgcli_s3_nodes | default(pgcli_s3_group | default('s3')) }}"
  gather_facts: false
  pre_tasks:
    - name: Prepare the shared cluster TLS material
      ansible.builtin.import_role:
        name: pg_s3
        tasks_from: shared_tls
  roles:
    - role: pgcli
      tags: [pgcli]

- name: Deploy the S3 object store
  hosts: "{{ pgcli_s3_nodes | default(pgcli_s3_group | default('s3')) }}"
  gather_facts: false
  serial: 1
  tags: [s3]
  roles:
    - role: pg_s3
    - role: pg_addon

- name: Create the S3 buckets and report the endpoint
  hosts: "{{ pgcli_s3_nodes | default(pgcli_s3_group | default('s3')) }}"
  gather_facts: false
  tags: [s3]
  tasks:
    - name: Create the S3 buckets and report the endpoint
      ansible.builtin.import_role:
        name: pg_s3
        tasks_from: buckets
