---
# Deploy a standalone S3-compatible object store for the pgBackRest `s3`
# backup target. Supports the three pgcli-managed stores: minio, silo and
# rustfs.
#
# Usage:
#   cd ansible
#   uv run ansible-playbook playbooks/deploy-s3.yaml
#   uv run ansible-playbook playbooks/deploy-s3.yaml --limit s3-01
#   uv run ansible-playbook playbooks/deploy-s3.yaml -e pgcli_s3_type=rustfs
#
# Defaults suit a pgBackRest repository: TLS on (pgBackRest refuses plaintext
# HTTP) and a listener reachable from the database hosts. Override the
# pgcli_s3_* defaults in group_vars/s3/main.yml.
#
# After the store is up, configure each database host with:
#   pg backup fetch-ca <store-host>:<api-port>
#   pg backup setup --s3-endpoint <url> --s3-bucket <bucket> \
#     --s3-access-key <user> --s3-secret-key <password> \
#     --s3-ca-file ~/.pgcli/backup/repo-ca/ca-<store-host>-<api-port>.crt
# then create instances with `pg create --backup-target s3`.

- name: Install and configure pgcli
  hosts: s3
  gather_facts: false
  roles:
    - role: pgcli
      tags: [pgcli]

- name: Deploy the S3 object store
  hosts: s3
  gather_facts: false
  serial: 1
  tags: [s3]
  pre_tasks:
    - name: Resolve the S3 store settings
      ansible.builtin.set_fact:
        _s3_type: "{{ pgcli_s3_type | default('minio') }}"
        _s3_name: "{{ pgcli_s3_name | default('backup') }}"
        _s3_api_port: "{{ pgcli_s3_api_port | default(9000) | int }}"
        _s3_console_port: "{{ pgcli_s3_console_port | default(9001) | int }}"
        _s3_listen: "{{ pgcli_s3_listen | default('0.0.0.0') }}"
        _s3_tls: "{{ pgcli_s3_tls | default(true) | bool }}"
        _s3_root_user: "{{ pgcli_s3_root_user | default('admin') }}"
        _s3_root_password: "{{ pgcli_s3_root_password | default('') }}"
        _s3_buckets: "{{ pgcli_s3_buckets | default([]) }}"
        _s3_alias: "{{ pgcli_s3_alias | default('pgcli-s3') }}"

    # Recommended: pgcli_s3_data_dir should live on a dedicated large-capacity
    # disk or RAID array, not the device holding the PostgreSQL data or the OS.
    # pgcli creates the directory automatically when it does not exist.
    - name: Resolve the S3 data directory
      ansible.builtin.set_fact:
        _s3_data_dir: "{{ pgcli_s3_data_dir | default(pgcli_config.base_dir ~ '/addon/' ~ _s3_type ~ '/' ~ _s3_name ~ '/data') }}"

    - name: Validate the S3 store type
      ansible.builtin.assert:
        that:
          - _s3_type in ['minio', 'silo', 'rustfs']
        fail_msg: >-
          pgcli_s3_type must be minio, silo or rustfs (got
          {{ _s3_type }}).

    - name: Resolve the S3 addressing
      ansible.builtin.set_fact:
        _s3_scheme: "{{ 'https' if _s3_tls | bool else 'http' }}"
        _s3_endpoint_host: "{{ private_ip | default(hostvars[inventory_hostname].ansible_host | default(inventory_hostname), true) }}"

    - name: Build the add-on install arguments
      ansible.builtin.set_fact:
        _s3_install_args: "{{ ['--api-port', _s3_api_port | string, '--console-port', _s3_console_port | string, '--listen', _s3_listen, '--root-user', _s3_root_user, '--data-dir', _s3_data_dir] + (['--tls'] if _s3_tls | bool else []) + (['--root-password', _s3_root_password] if _s3_root_password | length > 0 else []) }}"

    # The role installs through `pg addon install <type> --name <name> ...args`.
    - name: Define the S3 add-on
      ansible.builtin.set_fact:
        pgcli_addons:
          - type: "{{ _s3_type }}"
            name: "{{ _s3_name }}"
            args: "{{ _s3_install_args }}"
  roles:
    - role: pg_addon
  post_tasks:
    - name: Read the S3 root password
      ansible.builtin.command:
        argv:
          - "{{ pgcli_install_path }}"
          - "-c"
          - "{{ pgcli_config_path }}"
          - addon
          - password
          - "{{ _s3_type }}"
          - "--name"
          - "{{ _s3_name }}"
      register: _s3_password
      changed_when: false
      no_log: true
      when: _s3_buckets | length > 0

    # Loopback alias: pg mc adds --insecure for a loopback TLS store, so the
    # self-signed certificate does not need to be trusted here.
    - name: Register the loopback mc alias
      ansible.builtin.command:
        argv:
          - "{{ pgcli_install_path }}"
          - "-c"
          - "{{ pgcli_config_path }}"
          - mc
          - alias
          - set
          - "{{ _s3_alias }}"
          - "{{ _s3_scheme }}://127.0.0.1:{{ _s3_api_port }}"
          - "{{ _s3_root_user }}"
          - "{{ _s3_password.stdout | trim }}"
      no_log: true
      changed_when: false
      when: _s3_buckets | length > 0

    - name: Check the S3 buckets
      ansible.builtin.command:
        argv:
          - "{{ pgcli_install_path }}"
          - "-c"
          - "{{ pgcli_config_path }}"
          - mc
          - ls
          - "{{ _s3_alias }}/{{ item }}"
      register: _s3_bucket_check
      changed_when: false
      failed_when: false
      loop: "{{ _s3_buckets }}"
      loop_control:
        label: "{{ item }}"

    - name: Create the missing S3 buckets
      ansible.builtin.command:
        argv:
          - "{{ pgcli_install_path }}"
          - "-c"
          - "{{ pgcli_config_path }}"
          - mc
          - mb
          - "{{ _s3_alias }}/{{ item.item }}"
      loop: "{{ _s3_bucket_check.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.rc != 0

    - name: Show the S3 endpoint
      ansible.builtin.debug:
        msg:
          - "S3 endpoint:  {{ _s3_scheme }}://{{ _s3_endpoint_host }}:{{ _s3_api_port }}"
          - "Console:      {{ _s3_scheme }}://{{ _s3_endpoint_host }}:{{ _s3_console_port }}"
          - "Credentials:  {{ _s3_root_user }} / (pg addon password {{ _s3_type }} --name {{ _s3_name }})"
          - "Buckets:      {{ _s3_buckets | join(', ') if _s3_buckets | length > 0 else '(none)' }}"
          - "CA file:      {{ pgcli_cfg.base_dir | default(pgcli_config.base_dir) }}/tls/{{ _s3_type }}/{{ _s3_name }}/ca.crt"
          - "Consumers:    pg backup fetch-ca {{ _s3_endpoint_host }}:{{ _s3_api_port }}"
