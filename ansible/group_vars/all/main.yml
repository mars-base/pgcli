---
# Shared defaults for every pgcli host.
# Host-role groups (standalone_hosts, ha_hosts) override them in their own
# group_vars; host_vars only carry identity (instance name / HA member name).

pgcli_binary_src: "{{ inventory_dir | dirname }}/bin/pg"
pgcli_install_path: /usr/local/bin/pg
pgcli_config_path: /root/.pgcli/pg.yaml

# Consumed by `pg config init` on the first run only. Editing these later
# does NOT rewrite an existing pg.yaml.
pgcli_config_defaults:
  namespace: default
  base_dir: /data/pg
  backup_dir: /mnt/backup/pg
  pg_start_port: 35432
  pg_ssh_port: 42201

pgcli_config_overrides: {}
pgcli_config: "{{ pgcli_config_defaults | combine(pgcli_config_overrides) }}"

# Per-instance defaults merged over each pgcli_instances entry.
# state: present | started | stopped | absent
pgcli_instance_defaults:
  state: started
  autostart: false
  backup_target: local
  password_length: 16
  extensions: []

# Desired state consumed by the pg_instance / pg_addon roles.
pgcli_instances: []
pgcli_addons: []
