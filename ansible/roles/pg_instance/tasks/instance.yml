---
- name: Build the desired instance spec
  ansible.builtin.set_fact:
    _spec: "{{ pgcli_instance_defaults | combine(item) }}"
    _instances: "{{ pgcli_cfg.instances | default({}) }}"

- name: Validate the instance spec
  ansible.builtin.assert:
    that:
      - _spec.name is defined
      - _spec.name | length > 0
      - _spec.state in ['present', 'started', 'stopped', 'absent']
      - _spec.backup_target in ['local', 's3']
    fail_msg: "Invalid pgcli_instances entry: {{ item | to_nice_yaml }}"

# A same-host replica inherits the password, database, image, extensions and
# PITR settings from its primary; only its identity and lifecycle are local.
- name: Validate replica settings
  ansible.builtin.assert:
    that:
      - item.replica_of | length > 0
      - item.replica_of != item.name
      - item.backup_target is not defined
      - item.password_length is not defined
      - item.extensions is not defined
      - item.base_dir is not defined
    fail_msg: >-
      Invalid pgcli_instances replica entry: {{ item | to_nice_yaml }}.
      A replica accepts only name, host, replica_of, replica_of_host, state,
      autostart and clean_data; password, database, image, extensions, PITR,
      backup and base_dir settings are inherited from the primary.
  when: item.replica_of is defined

# The physical replication slot is named pgcli_r_<replica>, and PostgreSQL only
# allows lower case letters, digits and underscores there. Reject invalid
# names before pgcli writes a half-created instance. Absent entries may still
# be destroyed even if their name is invalid.
- name: Validate the replica name
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z0-9_]+$')
    fail_msg: >-
      Invalid replica name {{ item.name }}: replication slot
      pgcli_r_{{ item.name }} would contain invalid characters. Use only
      lower case letters, digits and underscores (for example pg01_ro1).
  when:
    - item.replica_of is defined
    - _spec.state != 'absent'

- name: Destroy the instance
  ansible.builtin.command:
    argv: "{{ [pgcli_install_path, '-c', pgcli_config_path, 'destroy', '-i', _spec.name, '--force'] + (['--clean-data'] if _spec.clean_data | default(false) else []) }}"
  when:
    - _spec.state == 'absent'
    - _instances.get(_spec.name) is not none

- name: Create the primary instance
  ansible.builtin.command:
    argv: "{{ [pgcli_install_path, '-c', pgcli_config_path, 'create', '-i', _spec.name, '--backup-target', _spec.backup_target, '--password-length', _spec.password_length | string] + (['--base-dir', _spec.base_dir] if _spec.base_dir is defined else []) }}"
  when:
    - _spec.state != 'absent'
    - _instances.get(_spec.name) is none
    - _spec.replica_of is not defined

- name: Decide whether the replica must be created
  ansible.builtin.set_fact:
    _create_replica: "{{ _spec.replica_of is defined and _spec.state != 'absent' and _instances.get(_spec.name) is none }}"

- name: Detect a cross-host replica
  ansible.builtin.set_fact:
    _cross_host_replica: "{{ _spec.replica_of is defined and ((_spec.replica_of_host | default('')) | length > 0) }}"

# `pg replica create` requires a running primary and inherits its settings, so
# fail with an actionable message before pgcli touches anything.
- name: Look up the replica primary
  ansible.builtin.set_fact:
    _primary_cfg: "{{ (pgcli_cfg.instances | default({})).get(_spec.replica_of, {}) }}"
  when:
    - _create_replica | bool
    - not _cross_host_replica | bool

- name: Require the replica primary to exist
  ansible.builtin.assert:
    that:
      - _primary_cfg | length > 0
      - _primary_cfg.podman.container_name | default('') | length > 0
    fail_msg: >-
      Replica {{ _spec.name }} requires primary {{ _spec.replica_of }}, which
      is not defined in {{ pgcli_config_path }}. Add the primary to
      pgcli_instances and rerun.
  when:
    - _create_replica | bool
    - not _cross_host_replica | bool

- name: Read the primary container state
  ansible.builtin.command:
    argv:
      - podman
      - inspect
      - "--format"
      - "{{ '{{.State.Running}}' }}"
      - "{{ _primary_cfg.podman.container_name }}"
  register: _pgcli_primary_container
  changed_when: false
  failed_when: false
  when:
    - _create_replica | bool
    - not _cross_host_replica | bool

- name: Require the replica primary to be running
  ansible.builtin.assert:
    that:
      - (_pgcli_primary_container.stdout | default('') | trim) == 'true'
    fail_msg: >-
      Replica {{ _spec.name }} requires primary {{ _spec.replica_of }} to be
      running. Set state: started on the primary entry and rerun.
  when:
    - _create_replica | bool
    - not _cross_host_replica | bool

- name: Create the replica
  ansible.builtin.command:
    argv:
      - "{{ pgcli_install_path }}"
      - "-c"
      - "{{ pgcli_config_path }}"
      - replica
      - create
      - "{{ _spec.name }}"
      - "-i"
      - "{{ _spec.replica_of }}"
  when:
    - _create_replica | bool
    - not _cross_host_replica | bool

# Cross-host replicas need one command on each side: prepare the primary on
# its own host, then create the replica here with --primary-dsn. The primary
# password is read from its pg.yaml at runtime and kept out of the vars.
- name: Require a known inventory host for the replica primary
  ansible.builtin.assert:
    that:
      - _spec.replica_of_host in groups['all']
      - _spec.replica_of_host != inventory_hostname
    fail_msg: >-
      Replica {{ _spec.name }} sets replica_of_host={{
      _spec.replica_of_host }}, but that host is not in the inventory or is
      this host. Use an inventory hostname, and omit replica_of_host for a
      same-host replica.
  when:
    - _create_replica | bool
    - _cross_host_replica | bool

# Same precedence as _node_ip: the primary's private address wins over
# ansible_host so replication crosses the private network.
- name: Resolve the remote primary address
  ansible.builtin.set_fact:
    _primary_host_ip: "{{ hostvars[_spec.replica_of_host].private_ip | default(hostvars[_spec.replica_of_host].ansible_host | default(_spec.replica_of_host), true) }}"
  when:
    - _cross_host_replica | bool

- name: Show the resolved remote primary address
  ansible.builtin.debug:
    msg: "replica_of_host={{ _spec.replica_of_host }} private_ip={{ hostvars[_spec.replica_of_host].private_ip | default('(unset)') }} ansible_host={{ hostvars[_spec.replica_of_host].ansible_host | default('(unset)') }} resolved={{ _primary_host_ip }}"
  when:
    - _cross_host_replica | bool
    - pgcli_debug_addresses | default(false) | bool

- name: Read the remote primary config
  ansible.builtin.command:
    argv:
      - "{{ hostvars[_spec.replica_of_host].pgcli_install_path | default(pgcli_install_path) }}"
      - "-c"
      - "{{ hostvars[_spec.replica_of_host].pgcli_config_path | default(pgcli_config_path) }}"
      - config
      - show
  delegate_to: "{{ _spec.replica_of_host }}"
  register: _pgcli_remote_primary_config
  changed_when: false
  when:
    - _create_replica | bool
    - _cross_host_replica | bool

- name: Resolve the remote primary instance
  ansible.builtin.set_fact:
    _remote_primary_cfg: "{{ ((_pgcli_remote_primary_config.stdout | from_yaml).instances | default({})).get(_spec.replica_of, {}) }}"
  when:
    - _create_replica | bool
    - _cross_host_replica | bool

- name: Require the remote primary instance to exist
  ansible.builtin.assert:
    that:
      - _remote_primary_cfg | length > 0
      - _remote_primary_cfg.podman.container_name | default('') | length > 0
      - _remote_primary_cfg.podman.host_port | default(0) | int > 0
      - _remote_primary_cfg.postgres | default({}) | length > 0
    fail_msg: >-
      Replica {{ _spec.name }} requires instance {{ _spec.replica_of }} on
      {{ _spec.replica_of_host }}, but it is not fully defined in that host's
      pgcli config.
  when:
    - _create_replica | bool
    - _cross_host_replica | bool

- name: Read the remote primary container state
  ansible.builtin.command:
    argv:
      - podman
      - inspect
      - "--format"
      - "{{ '{{.State.Running}}' }}"
      - "{{ _remote_primary_cfg.podman.container_name }}"
  delegate_to: "{{ _spec.replica_of_host }}"
  register: _pgcli_remote_primary_container
  changed_when: false
  failed_when: false
  when:
    - _create_replica | bool
    - _cross_host_replica | bool

- name: Require the remote primary to be running
  ansible.builtin.assert:
    that:
      - (_pgcli_remote_primary_container.stdout | default('') | trim) == 'true'
    fail_msg: >-
      Replica {{ _spec.name }} requires {{ _spec.replica_of }} on
      {{ _spec.replica_of_host }} to be running. Start it and rerun.
  when:
    - _create_replica | bool
    - _cross_host_replica | bool

- name: Prepare the remote primary for the replica
  ansible.builtin.command:
    argv:
      - "{{ hostvars[_spec.replica_of_host].pgcli_install_path | default(pgcli_install_path) }}"
      - "-c"
      - "{{ hostvars[_spec.replica_of_host].pgcli_config_path | default(pgcli_config_path) }}"
      - replica
      - create
      - "{{ _spec.name }}"
      - "-i"
      - "{{ _spec.replica_of }}"
      - "--replica-host"
      - "{{ _node_ip }}"
  delegate_to: "{{ _spec.replica_of_host }}"
  when:
    - _create_replica | bool
    - _cross_host_replica | bool

- name: Build the remote primary DSN
  ansible.builtin.set_fact:
    _primary_dsn: >-
      postgres://{{ _remote_primary_cfg.postgres.user | default('admin') | urlencode | replace('/', '%2F') }}:{{ _remote_primary_cfg.postgres.password | default('admin') | urlencode | replace('/', '%2F') }}@{{ _primary_host_ip }}:{{ _remote_primary_cfg.podman.host_port }}/{{ _remote_primary_cfg.postgres.database | default('admin') | urlencode | replace('/', '%2F') }}
  no_log: true
  when:
    - _create_replica | bool
    - _cross_host_replica | bool

- name: Create the cross-host replica
  ansible.builtin.command:
    argv:
      - "{{ pgcli_install_path }}"
      - "-c"
      - "{{ pgcli_config_path }}"
      - replica
      - create
      - "{{ _spec.name }}"
      - "--primary-dsn"
      - "{{ _primary_dsn }}"
      - "--primary-name"
      - "{{ _spec.replica_of }}"
  no_log: true
  when:
    - _create_replica | bool
    - _cross_host_replica | bool

- name: Refresh pgcli config after creating the instance
  ansible.builtin.command:
    argv:
      - "{{ pgcli_install_path }}"
      - "-c"
      - "{{ pgcli_config_path }}"
      - config
      - show
  register: pgcli_instance_config_refresh
  changed_when: false
  when:
    - _spec.state != 'absent'
    - _instances.get(_spec.name) is none

- name: Apply the refreshed config
  ansible.builtin.set_fact:
    pgcli_cfg: "{{ pgcli_instance_config_refresh.stdout | from_yaml }}"
  when:
    - _spec.state != 'absent'
    - _instances.get(_spec.name) is none

- name: Resolve the instance config
  ansible.builtin.set_fact:
    _inst_cfg: "{{ (pgcli_cfg.instances | default({})).get(_spec.name, {}) }}"

# An existing instance keeps its role; never silently treat a replica as a
# primary or vice versa.
- name: Verify the existing instance matches the desired role
  ansible.builtin.assert:
    that:
      - (_inst_cfg.replica_of | default('', true)) == (_spec.replica_of | default('', true))
    fail_msg: >-
      Instance {{ _spec.name }} exists with replica_of={{
      _inst_cfg.replica_of | default('(primary)', true) }}, but the desired
      replica_of is {{ _spec.replica_of | default('(primary)', true) }}.
      Destroy the instance first or fix the entry.
  when:
    - _spec.state != 'absent'
    - _instances.get(_spec.name) is not none

# backup_target is fixed at creation time; pgcli has no command to change it.
- name: Warn about creation-time settings that cannot change
  ansible.builtin.debug:
    msg: >-
      Instance {{ _spec.name }} was created with backup_target={{
      _inst_cfg.pitr.backup_target | default('local') }}, desired {{
      _spec.backup_target }}. Recreate the instance to change it.
  when:
    - _spec.state != 'absent'
    - _instances.get(_spec.name) is not none
    - _spec.replica_of is not defined
    - (_inst_cfg.pitr.backup_target | default('local')) != _spec.backup_target

- name: Enable instance autostart
  ansible.builtin.command:
    argv:
      - "{{ pgcli_install_path }}"
      - "-c"
      - "{{ pgcli_config_path }}"
      - autostart
      - enable
      - "-i"
      - "{{ _spec.name }}"
  when:
    - _spec.state != 'absent'
    - _spec.autostart | default(false) | bool
    - not (_inst_cfg.autostart | default(false) | bool)

- name: Disable instance autostart
  ansible.builtin.command:
    argv:
      - "{{ pgcli_install_path }}"
      - "-c"
      - "{{ pgcli_config_path }}"
      - autostart
      - disable
      - "-i"
      - "{{ _spec.name }}"
  when:
    - _spec.state != 'absent'
    - not (_spec.autostart | default(false) | bool)
    - _inst_cfg.autostart | default(false) | bool

- name: Resolve the extensions to install
  ansible.builtin.set_fact:
    _missing_extensions: "{{ _spec.extensions | default([]) | difference(_inst_cfg.extensions | default([])) }}"

- name: Resolve the container name
  ansible.builtin.set_fact:
    _container: "{{ _inst_cfg.podman.container_name | default('') }}"

# `pg create` only writes pg.yaml, so the container may not exist yet. `pg
# status` always exits 0; podman inspect is the source of truth for run state.
- name: Read the container state before changes
  ansible.builtin.command:
    argv:
      - podman
      - inspect
      - "--format"
      - "{{ '{{.State.Running}}' }}"
      - "{{ _container }}"
  register: pgcli_instance_container
  changed_when: false
  failed_when: false
  when:
    - _spec.state != 'absent'
    - _container | length > 0

- name: Record the previous running state
  ansible.builtin.set_fact:
    _was_running: "{{ (pgcli_instance_container.stdout | default('') | trim) == 'true' }}"
  when: _spec.state != 'absent'

# `pg extension install` replaces (rm + run) the container, so it needs a
# running instance even when the final state is stopped.
- name: Start the instance before extensions
  ansible.builtin.command:
    argv:
      - "{{ pgcli_install_path }}"
      - "-c"
      - "{{ pgcli_config_path }}"
      - start
      - "-i"
      - "{{ _spec.name }}"
  when:
    - _spec.state != 'absent'
    - not (_was_running | bool)
    - (_spec.state == 'started') or (_missing_extensions | length > 0)

- name: Install missing extensions
  ansible.builtin.command:
    argv: "{{ [pgcli_install_path, '-c', pgcli_config_path, 'extension', 'install', _missing_extensions | join(','), '--auto-restart', '-i', _spec.name] }}"
  when:
    - _spec.state != 'absent'
    - _missing_extensions | length > 0

- name: Read the container state after extensions
  ansible.builtin.command:
    argv:
      - podman
      - inspect
      - "--format"
      - "{{ '{{.State.Running}}' }}"
      - "{{ _container }}"
  register: pgcli_instance_container_after
  changed_when: false
  failed_when: false
  when:
    - _spec.state != 'absent'
    - _container | length > 0

- name: Stop the instance
  ansible.builtin.command:
    argv:
      - "{{ pgcli_install_path }}"
      - "-c"
      - "{{ pgcli_config_path }}"
      - stop
      - "-i"
      - "{{ _spec.name }}"
  when:
    - _spec.state == 'stopped'
    - (pgcli_instance_container_after.stdout | default('') | trim) == 'true'

# state=present leaves the run state unmanaged; undo a temporary start.
- name: Restore the stopped state
  ansible.builtin.command:
    argv:
      - "{{ pgcli_install_path }}"
      - "-c"
      - "{{ pgcli_config_path }}"
      - stop
      - "-i"
      - "{{ _spec.name }}"
  when:
    - _spec.state == 'present'
    - not (_was_running | bool)
    - (pgcli_instance_container_after.stdout | default('') | trim) == 'true'

- name: Start the instance
  ansible.builtin.command:
    argv:
      - "{{ pgcli_install_path }}"
      - "-c"
      - "{{ pgcli_config_path }}"
      - start
      - "-i"
      - "{{ _spec.name }}"
  when:
    - _spec.state == 'started'
    - (pgcli_instance_container_after.stdout | default('') | trim) != 'true'
