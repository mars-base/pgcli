---
- name: Read pgcli config
  ansible.builtin.command:
    argv:
      - "{{ pgcli_install_path }}"
      - "-c"
      - "{{ pgcli_config_path }}"
      - config
      - show
  register: pgcli_instance_config_raw
  changed_when: false

- name: Parse pgcli config
  ansible.builtin.set_fact:
    pgcli_cfg: "{{ pgcli_instance_config_raw.stdout | from_yaml }}"

- name: Reconcile instances
  ansible.builtin.include_tasks: instance.yml
  loop: "{{ pgcli_instances }}"
  loop_control:
    label: "{{ item.name | default('?') }}"
