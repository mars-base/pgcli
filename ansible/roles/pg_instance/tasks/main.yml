---
- name: Read pgcli config
  ansible.builtin.command:
    argv:
      - "{{ pgcli_install_path }}"
      - "-c"
      - "{{ pgcli_config_path }}"
      - config
      - show
  register: pgcli_instance_config_raw
  changed_when: false

- name: Parse pgcli config
  ansible.builtin.set_fact:
    pgcli_cfg: "{{ pgcli_instance_config_raw.stdout | from_yaml }}"

- name: Reconcile primary instances
  ansible.builtin.include_tasks: instance.yml
  loop: "{{ pgcli_instances | rejectattr('replica_of', 'defined') | list }}"
  loop_control:
    label: "{{ item.name | default('?') }}"

# Replicas run after every primary so `pg replica create -i` finds a running
# primary; the instance tasks also verify this before creating one.
- name: Reconcile replica instances
  ansible.builtin.include_tasks: instance.yml
  loop: "{{ pgcli_instances | selectattr('replica_of', 'defined') | list }}"
  loop_control:
    label: "{{ item.name | default('?') }}"
