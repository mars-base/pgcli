---
# Sources allowed to establish host SSH connections. At least one entry is
# required unless nftables_ssh_allow_all is true. Entries are IPv4 CIDRs or
# individual addresses. SSH from any other source is dropped, even when the
# source is in one of the nftables_sets below. Include the Ansible control
# node.
nftables_ssh_sources: []

# Accept SSH from any source. When true, nftables_ssh_sources may be empty.
nftables_ssh_allow_all: false

# Host SSH ports. List every port sshd listens on; hosts with non-standard
# ports can override the list in host_vars/<host>.yml.
nftables_ssh_ports:
  - 22

filter_forward_default_policy: drop
net_postrouting_default_policy: accept

# Two packet managers writing the ruleset is a common source of surprises.
# Set false when the host still relies on iptables-persistent.
nftables_remove_iptables_persistent: true

# Named address sets. The first entry is the trusted intranet range used by the
# default pgcli port rules in nftables_rules; add public-cloud or other
# intranet ranges after it. Entries are IPv4 CIDRs or individual addresses (a
# /32 is implied). The built-in `ssh_sources` set is generated from
# nftables_ssh_sources and must not be redefined here. An empty subnet is
# skipped, so the placeholder below is safe until you fill it in.
nftables_sets:
  - name: trusted
    subnet: []
  # - name: cloud
  #   subnet:
  #     - 203.0.113.0/24
  # - name: other_dc
  #   subnet:
  #     - 10.20.0.0/16

# Rules are inserted verbatim into the named chains. The supported chains are
# filter_default, filter_forward, nat_prerouting and nat_postrouting. A rule
# that references a set with no entries is skipped, so an empty list cannot
# produce an invalid ruleset. SSH is handled in the template from
# nftables_ssh_sources before these rules run.
#
# The default opens the trusted set to the pgcli PostgreSQL SQL port (35432),
# the instance SSH/pgBackRest port (42201), node_exporter (9100), pg_exporter
# (9630), Grafana (3000) and the legacy MinIO API/console (19800/19801).
# Override for custom ports, add-ons or extra sets.
nftables_rules:
  - chain: filter_default
    rules:
      - ip saddr $trusted tcp dport 35432 counter jump nolimit  # pgcli PostgreSQL SQL
      - ip saddr $trusted tcp dport 42201 counter jump nolimit  # pgBackRest backup SSH
      - ip saddr $trusted tcp dport 9100 counter jump nolimit  # node_exporter
      - ip saddr $trusted tcp dport 9630 counter jump nolimit  # pg_exporter
      - ip saddr $trusted tcp dport 3000 counter jump nolimit  # Grafana
      - ip saddr $trusted tcp dport { 19800, 19801 } counter jump nolimit  # MinIO API/console
