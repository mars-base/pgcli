---
- name: Require a supported host
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family in ['Debian', 'RedHat']
    fail_msg: >-
      The nftables role supports Debian-family (Debian, Ubuntu) and
      RedHat-family (Fedora, Rocky) hosts only.
    quiet: true

- name: Require nftables_ssh_sources to be a list
  ansible.builtin.assert:
    that:
      - nftables_ssh_sources | type_debug == 'list'
    fail_msg: >-
      nftables_ssh_sources must be a list of IPv4 CIDRs or individual
      addresses, for example [192.168.0.0/16].
    quiet: true

- name: Require an SSH source list
  ansible.builtin.assert:
    that:
      - (nftables_ssh_sources | length > 0) or nftables_ssh_allow_all | bool
    fail_msg: >-
      nftables_ssh_sources is empty and nftables_ssh_allow_all is false.
      Configure at least one IPv4 address or CIDR that may establish SSH
      connections, for example [192.168.0.0/16], and include the Ansible
      control node. Alternatively, set nftables_ssh_allow_all=true to accept
      SSH from any source.
    quiet: true

- name: Validate nftables_ssh_sources entries
  ansible.builtin.assert:
    that:
      - item is string
      - >-
        item is match('^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(/(3[0-2]|[12]?[0-9]))?$')
    fail_msg: >-
      nftables_ssh_sources entries must be IPv4 addresses or CIDR prefixes,
      for example 192.168.1.10 or 192.168.0.0/16; got
      {{ item | default('') }}.
    quiet: true
  loop: "{{ nftables_ssh_sources }}"
  loop_control:
    label: "{{ item | default('empty') }}"

- name: Require a non-empty SSH port list
  ansible.builtin.assert:
    that:
      - nftables_ssh_ports | type_debug == 'list'
      - nftables_ssh_ports | length > 0
    fail_msg: >-
      nftables_ssh_ports must be a non-empty list, for example [22] or
      [22, 2222].
    quiet: true

- name: Require nftables_sets to be a list
  ansible.builtin.assert:
    that:
      - nftables_sets | type_debug == 'list'
    fail_msg: "nftables_sets must be a list of {name, subnet} entries."
    quiet: true

- name: Validate nftables sets
  ansible.builtin.assert:
    that:
      - item.name is defined
      - (item.name | default('')) is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - (item.name | default('')) != 'ssh_sources'
      - item.subnet is defined
    fail_msg: >-
      Each nftables_sets entry needs a valid nft set name other than
      `ssh_sources` (built in from nftables_ssh_sources) and a subnet value.
    quiet: true
  loop: "{{ nftables_sets }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"

- name: Require unique nftables set names
  ansible.builtin.assert:
    that:
      - >-
        nftables_sets | map(attribute='name') | list | length
        == nftables_sets | map(attribute='name') | unique | list | length
    fail_msg: "nftables_sets contains duplicate set names."
    quiet: true

- name: Install nftables (Debian family)
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == 'Debian'

- name: Install nftables (RedHat family)
  ansible.builtin.dnf:
    name: nftables
    state: present
  when: ansible_facts.os_family == 'RedHat'

- name: Remove iptables persistence packages
  ansible.builtin.apt:
    name:
      - netfilter-persistent
      - iptables-persistent
    state: absent
  when:
    - ansible_facts.os_family == 'Debian'
    - nftables_remove_iptables_persistent | bool

- name: Check for ufw
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: nftables_ufw

- name: Read ufw status
  ansible.builtin.command: /usr/sbin/ufw status
  register: nftables_ufw_status
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - nftables_disable_ufw | bool
    - nftables_ufw.stat.exists

- name: Disable ufw
  ansible.builtin.command: /usr/sbin/ufw --force disable
  when:
    - nftables_disable_ufw | bool
    - nftables_ufw.stat.exists
    - "'Status: active' in (nftables_ufw_status.stdout | default(''))"

- name: Check for firewalld
  ansible.builtin.stat:
    path: /usr/sbin/firewalld
  register: nftables_firewalld

# Masked so D-Bus activation (for example a firewall-cmd call) cannot start
# it again. Restore with: systemctl unmask firewalld
- name: Disable firewalld
  ansible.builtin.service:
    name: firewalld
    state: stopped
    enabled: false
    masked: true
  when:
    - nftables_disable_firewalld | bool
    - nftables_firewalld.stat.exists

- name: Create /etc/nftables.d
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [nftables_conf, nftables_d]

- name: Apply nftables.conf
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ _nftables_config_file }}"
    owner: root
    group: root
    mode: "0640"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload nftables
  tags: [nftables_conf]

# Start after the template is in place. Starting first would load the
# distro-shipped /etc/nftables.conf (flush ruleset + an empty inet filter
# table), which then lingers in the live ruleset.
- name: Make sure nftables is started
  ansible.builtin.service:
    name: nftables
    state: started

# Remove the distro-shipped empty inet filter table if nftables was already
# running with the distro config. Only a provably inert table (no rules, no
# drop/reject policies) is deleted; anything else is left untouched.
- name: Read the inet filter table
  ansible.builtin.command: /usr/sbin/nft -j list table inet filter
  register: nftables_inet_filter
  changed_when: false
  failed_when: false
  check_mode: false

- name: Remove an empty leftover inet filter table
  ansible.builtin.command: /usr/sbin/nft delete table inet filter
  when:
    - nftables_inet_filter.rc == 0
    - "'\"rule\"' not in nftables_inet_filter.stdout"
    - "'\"policy\": \"drop\"' not in nftables_inet_filter.stdout"
    - "'\"policy\": \"reject\"' not in nftables_inet_filter.stdout"

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable nftables
  ansible.builtin.service:
    name: nftables
    enabled: true
