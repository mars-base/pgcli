---
# Normalize the pgcli_s3_* inputs and derive the layout, data locations,
# cluster endpoint matrix and host TLS paths. Pure fact-setting: no remote
# changes happen here.

- name: Resolve the S3 store settings
  ansible.builtin.set_fact:
    _s3_type: "{{ pgcli_s3_type | default('minio') }}"
    _s3_name: "{{ pgcli_s3_name | default('backup') }}"
    _s3_api_port: "{{ pgcli_s3_api_port | default(9000) | int }}"
    _s3_console_port: "{{ pgcli_s3_console_port | default(9001) | int }}"
    _s3_listen: "{{ pgcli_s3_listen | default('0.0.0.0') }}"
    _s3_tls: "{{ pgcli_s3_tls | default(true) | bool }}"
    _s3_root_user: "{{ pgcli_s3_root_user | default('admin') }}"
    _s3_root_password: "{{ pgcli_s3_root_password | default('') }}"
    _s3_buckets: "{{ pgcli_s3_buckets | default([]) }}"
    _s3_alias: "{{ pgcli_s3_alias | default('pgcli-s3') }}"
    _s3_drives: "{{ pgcli_s3_drives | default([]) }}"
    _s3_multi: "{{ groups['s3'] | length > 1 }}"
    _s3_explicit_endpoints: "{{ pgcli_s3_endpoints | default([]) }}"
    _s3_byo_tls: >-
      {{ (pgcli_s3_tls_cert | default('', true) | length > 0)
         or (pgcli_s3_tls_key | default('', true) | length > 0) }}
    _s3_shared_tls: >-
      {{ (pgcli_s3_tls | default(true) | bool)
         and ((groups['s3'] | length > 1)
              or (pgcli_s3_tls_cert | default('', true) | length > 0)
              or (pgcli_s3_tls_key | default('', true) | length > 0)) }}
    _s3_tls_cert_src: "{{ pgcli_s3_tls_cert | default(playbook_dir ~ '/../var/s3-tls/' ~ (pgcli_s3_name | default('backup')) ~ '/grid.crt') }}"
    _s3_tls_key_src: "{{ pgcli_s3_tls_key | default(playbook_dir ~ '/../var/s3-tls/' ~ (pgcli_s3_name | default('backup')) ~ '/grid.key') }}"
    _s3_scheme: "{{ 'https' if (pgcli_s3_tls | default(true) | bool) else 'http' }}"
    _s3_endpoint_host: "{{ private_ip | default(hostvars[inventory_hostname].ansible_host | default(inventory_hostname), true) }}"

- name: Resolve the deployment layout
  ansible.builtin.set_fact:
    _s3_mode: >-
      {{ ('SNSD' if _s3_drives | length == 0 else 'SNMD') if not (_s3_multi | bool)
         else ('MNMD' if _s3_drives | length > 0 else 'MNSD') }}
    _s3_drive_counts: >-
      {%- set counts = [] -%}
      {%- for h in groups['s3'] -%}
      {%-   set _ = counts.append((hostvars[h].pgcli_s3_drives | default(pgcli_s3_drives | default([]))) | length) -%}
      {%- endfor -%}
      {{ counts }}

# Recommended: data directories should live on dedicated disks, not the device
# holding the PostgreSQL data or the OS. pgcli creates them when missing.
# Multi-drive layouts take their data locations from pgcli_s3_drives, so the
# data dir is only resolved for the single-drive shape.
- name: Resolve the S3 data directory
  ansible.builtin.set_fact:
    _s3_data_dir: "{{ pgcli_s3_data_dir | default(pgcli_config.base_dir ~ '/addon/' ~ _s3_type ~ '/' ~ _s3_name ~ '/data') }}"
  when: _s3_drives | length == 0

# One endpoint per node's export, or one per drive slot in MNMD. Built in
# inventory order so every node receives the identical matrix.
- name: Build the cluster endpoint matrix
  ansible.builtin.set_fact:
    _s3_auto_endpoints: >-
      {%- set eps = [] -%}
      {%- for h in groups['s3'] -%}
      {%-   set hv = hostvars[h] -%}
      {%-   set ip = hv.private_ip | default(hv.ansible_host | default(h, true), true) -%}
      {%-   set base = _s3_scheme ~ '://' ~ ip ~ ':' ~ _s3_api_port -%}
      {%-   set hdrives = hv.pgcli_s3_drives | default(pgcli_s3_drives | default([])) -%}
      {%-   if _s3_type == 'rustfs' -%}
      {%-     set _ = eps.append(base) -%}
      {%-   elif hdrives | length > 0 -%}
      {%-     for i in range(1, hdrives | length + 1) -%}
      {%-       set _ = eps.append(base ~ '/data' ~ i) -%}
      {%-     endfor -%}
      {%-   else -%}
      {%-     set _ = eps.append(base ~ '/data') -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ eps }}
  when: _s3_multi | bool

- name: Resolve the cluster endpoints
  ansible.builtin.set_fact:
    _s3_endpoints: "{{ _s3_explicit_endpoints if _s3_explicit_endpoints | length > 0 else (_s3_auto_endpoints | default([])) }}"

- name: Resolve the host TLS paths
  ansible.builtin.set_fact:
    _s3_tls_cert_host: "{{ pgcli_config.base_dir }}/tls/{{ _s3_type }}/{{ _s3_name }}/grid.crt"
    _s3_tls_key_host: "{{ pgcli_config.base_dir }}/tls/{{ _s3_type }}/{{ _s3_name }}/grid.key"
    _s3_tls_ca_host: "{{ pgcli_config.base_dir }}/tls/{{ _s3_type }}/{{ _s3_name }}/ca.crt"
