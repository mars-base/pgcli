---
- name: Validate the add-on spec
  ansible.builtin.assert:
    that:
      - addon.type is defined
      - addon.type | length > 0
      - (addon.instance is defined) or (addon.name is defined) or (addon.pg_name is defined)
      - addon.pg_name is not defined or addon.pg_name is string
      - addon.dsn is not defined or addon.dsn is string
      - (addon.state | default('present')) in ['present', 'absent']
      - addon.params is not defined or (addon.params is sequence and addon.params is not string and addon.params is not mapping)
      - addon.args is not defined or (addon.args is sequence and addon.args is not string and addon.args is not mapping)
      - addon.conf is not defined or addon.conf is string
    fail_msg: >-
      Each pgcli_addons entry needs type plus either name (top-level),
      instance (instance-scoped), or pg_name (remote PgBouncer/PostgREST),
      and state present|absent. params and args must be lists and conf must be
      a string.

- name: Resolve the add-on key
  ansible.builtin.set_fact:
    _addon_key: "{{ addon.type | replace('-', '_') }}"
    _addon_key_name: >-
      {{ addon.instance if addon.instance is defined
         else addon.name if addon.name is defined
         else addon.pg_name }}
    _addon_selector: >-
      {{ ['-i', addon.instance] if addon.instance is defined
         else ['--pg-name', addon.pg_name] if addon.pg_name is defined
         else ['--name', addon.name] }}
    _addon_dsn_args: "{{ ['--dsn', addon.dsn] if addon.dsn is defined else [] }}"
    _addon_state: "{{ addon.state | default('present') }}"
    _addon_force: "{{ addon.force | default(false) | bool }}"

# An entry may set `params` to its own complete list of `pg addon install`
# flags; that replaces the group-level addon_<type>_params for the entry.
# Entries without params inherit the group-level list. Per-entry `args` is
# always appended last.
- name: Resolve the add-on parameters
  ansible.builtin.set_fact:
    _addon_params: >-
      {{ addon.params if addon.params is defined
         else lookup('vars', 'addon_' ~ _addon_key ~ '_params', default=[]) }}

- name: Validate the resolved add-on parameters
  ansible.builtin.assert:
    that:
      - _addon_params is sequence
      - _addon_params is not string
      - _addon_params is not mapping
    fail_msg: "params and addon_{{ _addon_key }}_params must be lists of CLI flags."

# conf may be set per entry, or once per group as addon_<type>_conf for the
# add-ons that accept --conf-file.
- name: Resolve the inline add-on config path
  ansible.builtin.set_fact:
    _addon_conf_content: >-
      {{ addon.conf if addon.conf is defined
         else lookup('vars', 'addon_' ~ _addon_key ~ '_conf', default='') }}
    _addon_conf_dir: "{{ pgcli_config_path | dirname }}/addons"
    _addon_conf_path: >-
      {{ (pgcli_config_path | dirname) ~ '/addons/' ~ addon.type ~ '-'
         ~ (_addon_key_name | regex_replace('[^A-Za-z0-9_.-]', '_')) ~ '.conf' }}

- name: Validate the inline add-on config
  ansible.builtin.assert:
    that:
      - _addon_conf_content | length == 0 or addon.type in ['nginx', 'haproxy', 'prometheus', 'alertmanager']
      - _addon_conf_content | length == 0 or ((_addon_params | map('string') | select('match', '^--conf-file') | list) | length) == 0
      - _addon_conf_content | length == 0 or (((addon.args | default([])) | map('string') | select('match', '^--conf-file') | list) | length) == 0
    fail_msg: >-
      conf is only supported by nginx, haproxy, prometheus and alertmanager,
      and cannot be combined with an explicit --conf-file in params or args.

- name: Create the add-on config directory
  ansible.builtin.file:
    path: "{{ _addon_conf_dir }}"
    state: directory
    mode: '0700'
  when:
    - _addon_state == 'present'
    - _addon_conf_content | length > 0

- name: Write the inline add-on config
  ansible.builtin.copy:
    content: "{{ _addon_conf_content }}"
    dest: "{{ _addon_conf_path }}"
    mode: '0600'
  when:
    - _addon_state == 'present'
    - _addon_conf_content | length > 0

- name: Remove the inline add-on config
  ansible.builtin.file:
    path: "{{ _addon_conf_path }}"
    state: absent
  when: _addon_state == 'absent'

- name: Resolve add-on facts
  ansible.builtin.set_fact:
    _addon_installed: >-
      {%- if addon.instance is defined -%}
      {{ ((pgcli_cfg.get('instances') or {}).get(addon.instance, {}).get('addons') or {}).get(_addon_key) is not none }}
      {%- else -%}
      {{ ((pgcli_cfg.get('addons') or {}).get(_addon_key) or {}).get(_addon_key_name) is not none }}
      {%- endif -%}

- name: Build the add-on install command
  ansible.builtin.set_fact:
    _addon_install_argv: >-
      {{ [pgcli_install_path, '-c', pgcli_config_path, 'addon', 'install', addon.type]
         + _addon_selector
         + _addon_dsn_args
         + (['--force'] if _addon_force | bool else [])
         + (_addon_params | map('string') | list)
         + (['--conf-file', _addon_conf_path] if _addon_conf_content | length > 0 else [])
         + (addon.args | default([]) | map('string') | list) }}

- name: Install the add-on
  ansible.builtin.command:
    argv: "{{ _addon_install_argv }}"
  register: _addon_install
  when:
    - _addon_state == 'present'
    - (not (_addon_installed | bool)) or (_addon_force | bool)

- name: Refresh the pgcli config after installing
  ansible.builtin.command:
    argv:
      - "{{ pgcli_install_path }}"
      - "-c"
      - "{{ pgcli_config_path }}"
      - config
      - show
  register: _addon_config_refresh
  changed_when: false
  when: _addon_install is changed

- name: Apply the refreshed pgcli config
  ansible.builtin.set_fact:
    pgcli_cfg: "{{ _addon_config_refresh.stdout | from_yaml }}"
  when: _addon_config_refresh.stdout is defined

- name: Resolve the current add-on entry
  ansible.builtin.set_fact:
    _addon_cfg: >-
      {{ ( ((pgcli_cfg.get('instances') or {}).get(addon.instance, {}).get('addons') or {}).get(_addon_key)
           if addon.instance is defined else
           ((pgcli_cfg.get('addons') or {}).get(_addon_key) or {}).get(_addon_key_name) )
         | default({}, true) }}
    _addon_autostart: "{{ addon.autostart | default(true) | bool }}"

- name: Enable add-on autostart
  ansible.builtin.command:
    argv: "{{ [pgcli_install_path, '-c', pgcli_config_path, 'autostart', 'enable'] + _addon_selector + ['--' + (addon.type | replace('_', '-'))] }}"
  when:
    - _addon_state == 'present'
    - _addon_cfg | length > 0
    - _addon_autostart | bool
    - not ((_addon_cfg.autostart | default(false)) | bool)

- name: Disable add-on autostart
  ansible.builtin.command:
    argv: "{{ [pgcli_install_path, '-c', pgcli_config_path, 'autostart', 'disable'] + _addon_selector + ['--' + (addon.type | replace('_', '-'))] }}"
  when:
    - _addon_state == 'present'
    - _addon_cfg | length > 0
    - not (_addon_autostart | bool)
    - (_addon_cfg.autostart | default(false)) | bool

# A fresh etcd member returns from `addon install` before it can answer
# requests. The next host in this serial:1 play joins it, so wait here before
# the play advances.
- name: Resolve the etcd client port
  ansible.builtin.set_fact:
    _addon_etcd_port: >-
      {{ _addon_install_argv[_addon_install_argv.index('--client-port') + 1]
         if '--client-port' in _addon_install_argv else 2379 }}

- name: Wait for the etcd client port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ _addon_etcd_port }}"
    timeout: 60
  when:
    - addon.type == 'etcd'
    - _addon_state == 'present'

- name: Wait for etcd to answer requests
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ _addon_etcd_port }}/version"
    status_code: 200
  register: _addon_etcd_ready
  until: _addon_etcd_ready.status | default(0) == 200
  retries: 30
  delay: 1
  when:
    - addon.type == 'etcd'
    - _addon_state == 'present'

- name: Remove the add-on
  ansible.builtin.command:
    argv: "{{ [pgcli_install_path, '-c', pgcli_config_path, 'addon', 'remove', addon.type] + _addon_selector + (['--clean-data'] if addon.clean_data | default(true) else []) }}"
  when:
    - _addon_state == 'absent'
    - _addon_installed | bool
