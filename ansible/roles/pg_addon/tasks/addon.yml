---
- name: Validate the add-on spec
  ansible.builtin.assert:
    that:
      - addon.type is defined
      - addon.type | length > 0
      - (addon.instance is defined) or (addon.name is defined) or (addon.pg_name is defined)
      - addon.pg_name is not defined or addon.pg_name is string
      - addon.dsn is not defined or addon.dsn is string
      - (addon.state | default('present')) in ['present', 'absent']
      - addon.params is not defined or (addon.params is sequence and addon.params is not string and addon.params is not mapping)
      - addon.args is not defined or (addon.args is sequence and addon.args is not string and addon.args is not mapping)
      - addon.conf is not defined or addon.conf is string
      - addon.rule_files is not defined or addon.rule_files is mapping
      - addon.autoreload is not defined or addon.autoreload is boolean
      - not (addon.autoreload | default(false) | bool)
        or (addon.type == 'safeline' and addon.name is defined)
      - addon.sites is not defined
        or (addon.sites is sequence and addon.sites is not string and addon.sites is not mapping)
      - (addon.sites | default([]) | length == 0)
        or (addon.type == 'safeline' and addon.name is defined)
    fail_msg: >-
      Each pgcli_addons entry needs type plus either name (top-level),
      instance (instance-scoped), or pg_name (remote PgBouncer/PostgREST),
      and state present|absent. params and args must be lists, conf must be a
      string, rule_files must be a mapping of filenames to contents,
      autoreload is a boolean supported by top-level safeline entries only,
      and sites is a list supported by top-level safeline entries only.

- name: Resolve the add-on key
  ansible.builtin.set_fact:
    _addon_key: "{{ addon.type | replace('-', '_') }}"
    _addon_key_name: >-
      {{ addon.instance if addon.instance is defined
         else addon.name if addon.name is defined
         else addon.pg_name }}
    _addon_selector: >-
      {{ ['-i', addon.instance] if addon.instance is defined
         else ['--pg-name', addon.pg_name] if addon.pg_name is defined
         else ['--name', addon.name] }}
    _addon_dsn_args: "{{ ['--dsn', addon.dsn] if addon.dsn is defined else [] }}"
    _addon_state: "{{ addon.state | default('present') }}"
    _addon_force: "{{ addon.force | default(false) | bool }}"
    _addon_sites: []
    _addon_sites_new: []
    _addon_sites_moved: []
    _addon_sites_existing: {}

# Offline installs only preload the core images. Entries marked auto_load: true
# in pgcli_images declare the add-on types that need them; pull exactly this
# add-on's images from the offline server before `pg addon install` runs.
- name: Resolve the add-on images
  ansible.builtin.set_fact:
    _addon_images: >-
      {{ pgcli_images | selectattr('auto_load', 'defined') | selectattr('auto_load')
         | selectattr('addons', 'defined')
         | selectattr('addons', 'contains', _addon_key) | list }}

- name: Load the add-on images from the offline server
  ansible.builtin.include_role:
    name: pgcli
    tasks_from: images
  vars:
    _pgcli_images_to_load: "{{ _addon_images }}"
  when:
    - _addon_state == 'present'
    - pgcli_images_http_url | length > 0
    - _addon_images | length > 0

# --monitor-password carries a plaintext secret in the params list. Detect it
# up front so the tasks that resolve/render/run the argv can suppress their
# output; the condition is checked on both the entry and group-level sources.
- name: Check whether the add-on parameters carry a monitor password
  ansible.builtin.set_fact:
    _addon_params_carry_monitor_password: >-
      {{ ('--monitor-password' in (addon.params | default([])))
         or ('--monitor-password' in lookup('vars', 'addon_' ~ (_addon_kind | default('')) ~ '_params', default=[])) }}

# An entry may set `params` to its own complete list of `pg addon install`
# flags; that replaces the group-level list for the entry. The group-level
# variable is addon_<group>_params for a group selected by --limit (for
# example addon_redis_cluster_params), falling back to addon_<type>_params
# used by ha_etcd and pg_s3. Per-entry `args` is always appended last.
- name: Resolve the add-on parameters
  ansible.builtin.set_fact:
    _addon_params: >-
      {{ addon.params if addon.params is defined
         else lookup('vars', 'addon_' ~ (_addon_kind | default('')) ~ '_params',
                     default=lookup('vars', 'addon_' ~ _addon_key ~ '_params', default=[])) }}
  no_log: "{{ _addon_params_carry_monitor_password | bool }}"

- name: Validate the resolved add-on parameters
  ansible.builtin.assert:
    that:
      - _addon_params is sequence
      - _addon_params is not string
      - _addon_params is not mapping
    fail_msg: >-
      params and the group-level addon_<group>_params (or addon_<type>_params)
      must be lists of CLI flags.
  no_log: "{{ _addon_params_carry_monitor_password | bool }}"

# conf may be set per entry, or once per group as addon_<group>_conf for the
# add-ons that accept --conf-file (addon_<type>_conf is the fallback).
- name: Resolve the inline add-on config path
  ansible.builtin.set_fact:
    _addon_conf_content: >-
      {{ addon.conf if addon.conf is defined
         else lookup('vars', 'addon_' ~ (_addon_kind | default('')) ~ '_conf',
                     default=lookup('vars', 'addon_' ~ _addon_key ~ '_conf', default='')) }}
    _addon_conf_dir: "{{ pgcli_config_path | dirname }}/addons"
    _addon_site_cert_dir: >-
      {{ (pgcli_config_path | dirname) ~ '/addons/' ~ addon.type ~ '-'
         ~ (_addon_key_name | regex_replace('[^A-Za-z0-9_.-]', '_')) ~ '-certs' }}
    _addon_conf_path: >-
      {{ (pgcli_config_path | dirname) ~ '/addons/' ~ addon.type ~ '-'
         ~ (_addon_key_name | regex_replace('[^A-Za-z0-9_.-]', '_')) ~ '.conf' }}

- name: Resolve the inline rule files
  ansible.builtin.set_fact:
    _addon_rule_files: "{{ addon.rule_files | default({}) }}"
    _addon_rule_prefix: >-
      {{ (pgcli_config_path | dirname) ~ '/addons/' ~ addon.type ~ '-'
         ~ (_addon_key_name | regex_replace('[^A-Za-z0-9_.-]', '_')) ~ '-' }}

- name: Validate the inline rule files
  ansible.builtin.assert:
    that:
      - _addon_rule_files is mapping
      - (_addon_rule_files | length == 0) or addon.type == 'prometheus'
      - (_addon_rule_files | dict2items | map(attribute='key')
         | map('regex_replace', '[^A-Za-z0-9_.-]', '_') | unique | length)
        == (_addon_rule_files | length)
      - (_addon_rule_files | dict2items | map(attribute='value')
         | select('string') | list | length) == (_addon_rule_files | length)
    fail_msg: >-
      rule_files is supported by prometheus only, must be a mapping of
      filenames to source paths on the controller, and filenames must stay
      unique after sanitising.

- name: Validate the declared protected sites
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.ports is defined
      - item.ports is sequence and item.ports is not string and item.ports is not mapping
      - item.ports | length > 0
      - item.domains is not defined or (item.domains is sequence and item.domains is not string and item.domains is not mapping)
      - item.domains is not defined or item.domains | length > 0
      - item.upstream is defined
      - item.upstream is string and item.upstream | length > 0
      - (item.cert is defined) == (item.key is defined)
      - item.cert is not defined or (item.cert is string and item.cert.startswith('/'))
      - item.key is not defined or (item.key is string and item.key.startswith('/'))
      - item.health_check is not defined or item.health_check is boolean
      - (item.health_check_interval is not defined and item.health_check_path is not defined)
        or (item.health_check | default(false) | bool)
      - item.health_check_interval is not defined
        or (item.health_check_interval is number and item.health_check_interval >= 10 and item.health_check_interval <= 3600)
      - item.health_check_path is not defined or (item.health_check_path is string and item.health_check_path.startswith('/'))
      - item.comment is not defined or item.comment is string
    fail_msg: >-
      Each sites entry is a mapping with ports (a non-empty list of entry
      ports; suffix a port _ssl to terminate TLS on it) and exactly one
      upstream URL (the Community Edition allows one upstream per site),
      plus optional domains (default ["*"]), cert and key (both required
      together, absolute controller file paths of the PEM certificate and
      private key), health_check with health_check_interval (10-3600) and
      health_check_path, and comment.
  loop: "{{ addon.sites | default([]) }}"
  when:
    - addon.state | default('present') == 'present'
    - addon.sites | default([]) | length > 0

- name: Resolve the inline rule file paths
  ansible.builtin.set_fact:
    _addon_rule_paths: >-
      {{ _addon_rule_files | dict2items | map(attribute='key')
         | map('regex_replace', '[^A-Za-z0-9_.-]', '_')
         | map('regex_replace', '^', _addon_rule_prefix) | list }}

- name: Resolve the inline rule file arguments
  ansible.builtin.set_fact:
    _addon_rule_args: "{{ (['--rule-file'] | product(_addon_rule_paths) | list) | flatten }}"

- name: Validate the inline add-on config
  ansible.builtin.assert:
    that:
      - _addon_conf_content | length == 0 or addon.type in ['nginx', 'haproxy', 'privoxy', 'prometheus', 'alertmanager']
      - _addon_conf_content | length == 0 or ((_addon_params | map('string') | select('match', '^--conf-file') | list) | length) == 0
      - _addon_conf_content | length == 0 or (((addon.args | default([])) | map('string') | select('match', '^--conf-file') | list) | length) == 0
    fail_msg: >-
      conf is only supported by nginx, haproxy, privoxy, prometheus and
      alertmanager, and cannot be combined with an explicit --conf-file in
      params or args.

- name: Create the add-on config directory
  ansible.builtin.file:
    path: "{{ _addon_conf_dir }}"
    state: directory
    mode: '0700'
  when:
    - _addon_state == 'present'
    - (_addon_conf_content | length > 0) or (_addon_rule_files | length > 0)

- name: Write the inline add-on config
  ansible.builtin.copy:
    content: "{{ _addon_conf_content }}"
    dest: "{{ _addon_conf_path }}"
    mode: '0600'
  when:
    - _addon_state == 'present'
    - _addon_conf_content | length > 0

- name: Write the inline add-on rule files
  ansible.builtin.copy:
    src: "{{ item.value }}"
    dest: "{{ _addon_rule_prefix }}{{ item.key | regex_replace('[^A-Za-z0-9_.-]', '_') }}"
    mode: '0600'
  loop: "{{ _addon_rule_files | dict2items }}"
  when:
    - _addon_state == 'present'
    - _addon_rule_files | length > 0

- name: Remove the inline add-on config
  ansible.builtin.file:
    path: "{{ _addon_conf_path }}"
    state: absent
  when: _addon_state == 'absent'

- name: Remove the inline add-on rule files
  ansible.builtin.file:
    path: "{{ _addon_rule_prefix }}{{ item.key | regex_replace('[^A-Za-z0-9_.-]', '_') }}"
    state: absent
  loop: "{{ _addon_rule_files | dict2items }}"
  when:
    - _addon_state == 'absent'
    - _addon_rule_files | length > 0

- name: Resolve add-on facts
  ansible.builtin.set_fact:
    _addon_installed: >-
      {%- if addon.instance is defined -%}
      {{ ((pgcli_cfg.get('instances') or {}).get(addon.instance, {}).get('addons') or {}).get(_addon_key) is not none }}
      {%- else -%}
      {{ ((pgcli_cfg.get('addons') or {}).get(_addon_key) or {}).get(_addon_key_name) is not none }}
      {%- endif -%}

- name: Build the add-on install command
  ansible.builtin.set_fact:
    _addon_install_argv: >-
      {{ [pgcli_install_path, '-c', pgcli_config_path, 'addon', 'install', addon.type]
         + _addon_selector
         + _addon_dsn_args
         + (['--force'] if _addon_force | bool else [])
         + (_addon_params | map('string') | list)
         + _addon_rule_args
         + (['--conf-file', _addon_conf_path] if _addon_conf_content | length > 0 else [])
         + (addon.args | default([]) | map('string') | list) }}
  no_log: "{{ _addon_params_carry_monitor_password | bool }}"

- name: Install the add-on
  ansible.builtin.command:
    argv: "{{ _addon_install_argv }}"
  register: _addon_install
  no_log: "{{ _addon_params_carry_monitor_password | bool }}"
  when:
    - _addon_state == 'present'
    - (not (_addon_installed | bool)) or (_addon_force | bool)

- name: Refresh the pgcli config after installing
  ansible.builtin.command:
    argv:
      - "{{ pgcli_install_path }}"
      - "-c"
      - "{{ pgcli_config_path }}"
      - config
      - show
  register: _addon_config_refresh
  changed_when: false
  when: _addon_install is changed

- name: Apply the refreshed pgcli config
  ansible.builtin.set_fact:
    pgcli_cfg: "{{ _addon_config_refresh.stdout | from_yaml }}"
  when: _addon_config_refresh.stdout is defined

- name: Resolve the current add-on entry
  ansible.builtin.set_fact:
    _addon_cfg: >-
      {{ ( ((pgcli_cfg.get('instances') or {}).get(addon.instance, {}).get('addons') or {}).get(_addon_key)
           if addon.instance is defined else
           ((pgcli_cfg.get('addons') or {}).get(_addon_key) or {}).get(_addon_key_name) )
         | default({}, true) }}
    _addon_autostart: "{{ addon.autostart | default(true) | bool }}"

- name: Enable add-on autostart
  ansible.builtin.command:
    argv: "{{ [pgcli_install_path, '-c', pgcli_config_path, 'autostart', 'enable'] + _addon_selector + ['--' + (addon.type | replace('_', '-'))] }}"
  when:
    - _addon_state == 'present'
    - _addon_cfg | length > 0
    - _addon_autostart | bool
    - not ((_addon_cfg.autostart | default(false)) | bool)

- name: Disable add-on autostart
  ansible.builtin.command:
    argv: "{{ [pgcli_install_path, '-c', pgcli_config_path, 'autostart', 'disable'] + _addon_selector + ['--' + (addon.type | replace('_', '-'))] }}"
  when:
    - _addon_state == 'present'
    - _addon_cfg | length > 0
    - not (_addon_autostart | bool)
    - (_addon_cfg.autostart | default(false)) | bool

# ---------------------------------------------------------------------------
# Declarative protected sites (safeline only). Each apply reads the console's
# site list and reconciles by identity (the domain set plus the entry port
# set): a declared site that does not exist yet is created — its PEM files
# are copied from the controller and uploaded together with the site — and
# an existing site whose single upstream changed is updated in place. Other
# fields of an existing site are left alone, and a site dropped from `sites`
# is NOT deleted from the console ('pg addon safeline site delete' does
# that). Certificates are only uploaded when a site is created; renewing one
# stays manual ('pg addon safeline cert update').
- name: List the safeline protected sites
  ansible.builtin.command:
    argv:
      - "{{ pgcli_install_path }}"
      - "-c"
      - "{{ pgcli_config_path }}"
      - addon
      - safeline
      - site
      - list
      - "--name"
      - "{{ addon.name }}"
  register: _addon_site_list
  changed_when: false
  when:
    - addon.type == 'safeline'
    - _addon_state == 'present'
    - _addon_cfg | length > 0
    - addon.sites | default([]) | length > 0

# site list columns: ID DOMAINS PORTS UPSTREAMS STATUS MODE HEALTH COMMENT.
# The first four are whitespace-free and fixed-position; HEALTH and COMMENT
# may contain spaces, so only these four are parsed.
- name: Index the existing protected sites
  ansible.builtin.set_fact:
    _addon_sites_existing: >-
      {{ _addon_sites_existing | combine({
           (item.split()[1].split(',') | map('lower') | sort | join(','))
           ~ '|' ~ (item.split()[2].split(',') | map('string') | sort | join(',')):
           {'id': item.split()[0] | int,
            'upstreams': item.split()[3].split(',')} }) }}
  loop: "{{ (_addon_site_list.stdout_lines | default([]))[1:] }}"
  when:
    - addon.type == 'safeline'
    - _addon_state == 'present'
    - item | trim | length > 0

- name: Resolve the declared protected sites
  ansible.builtin.set_fact:
    _addon_sites: >-
      {{ _addon_sites + [ item | combine({
           'domains': item.domains | default(['*']) | map('string') | map('trim') | map('lower') | unique | sort,
           'ports': item.ports | map('string') | sort,
           'site_key':
             ((item.domains | default(['*']) | map('string') | map('trim') | map('lower') | unique | sort) | join(','))
             ~ '|' ~ ((item.ports | map('string') | sort) | join(',')) }) ] }}
  loop: "{{ addon.sites | default([]) }}"
  when:
    - addon.type == 'safeline'
    - _addon_state == 'present'

- name: Check the declared protected sites are unique
  ansible.builtin.assert:
    that:
      - _addon_sites | map(attribute='site_key') | unique | length == _addon_sites | length
    fail_msg: >-
      sites entries must be unique after normalising: two entries share the
      same domains plus ports.
  when:
    - addon.type == 'safeline'
    - _addon_state == 'present'
    - _addon_sites | length > 0

- name: Select the declared sites that need creating
  ansible.builtin.set_fact:
    _addon_sites_new: "{{ _addon_sites | rejectattr('site_key', 'in', _addon_sites_existing) | list }}"
  when:
    - addon.type == 'safeline'
    - _addon_state == 'present'

- name: Select the declared sites whose upstream changed
  ansible.builtin.set_fact:
    _addon_sites_moved: >-
      {{ _addon_sites_moved + [ item | combine({
           'site_id': _addon_sites_existing[item.site_key].id }) ] }}
  loop: "{{ _addon_sites | selectattr('site_key', 'in', _addon_sites_existing) | list }}"
  when:
    - addon.type == 'safeline'
    - _addon_state == 'present'
    - _addon_sites_existing[item.site_key].upstreams != [item.upstream]

- name: Create the staged certificate directory
  ansible.builtin.file:
    path: "{{ _addon_site_cert_dir }}"
    state: directory
    mode: '0700'
  when:
    - addon.type == 'safeline'
    - _addon_state == 'present'
    - _addon_sites_new | selectattr('cert', 'defined') | list | length > 0

- name: Stage the declared site certificates
  ansible.builtin.copy:
    src: "{{ item.cert }}"
    dest: "{{ _addon_site_cert_dir }}/{{ item.site_key | regex_replace('[^A-Za-z0-9_.-]', '_') }}.pem"
    mode: '0600'
  loop: "{{ _addon_sites_new }}"
  when:
    - addon.type == 'safeline'
    - _addon_state == 'present'
    - item.cert is defined

- name: Stage the declared site private keys
  ansible.builtin.copy:
    src: "{{ item.key }}"
    dest: "{{ _addon_site_cert_dir }}/{{ item.site_key | regex_replace('[^A-Za-z0-9_.-]', '_') }}.key"
    mode: '0600'
  loop: "{{ _addon_sites_new }}"
  when:
    - addon.type == 'safeline'
    - _addon_state == 'present'
    - item.key is defined

- name: Create the declared protected sites
  ansible.builtin.command:
    argv: >-
      {{ [pgcli_install_path, '-c', pgcli_config_path, 'addon', 'safeline', 'site', 'create', '--name', addon.name]
         + ['--domain'] + item.domains
         + ['--port'] + item.ports
         + ['--upstream', item.upstream]
         + (['--cert', _addon_site_cert_dir ~ '/' ~ (item.site_key | regex_replace('[^A-Za-z0-9_.-]', '_')) ~ '.pem',
             '--key', _addon_site_cert_dir ~ '/' ~ (item.site_key | regex_replace('[^A-Za-z0-9_.-]', '_')) ~ '.key']
            if item.cert is defined else [])
         + (['--health-check'] if item.health_check | default(false) | bool else [])
         + (['--health-check-interval', item.health_check_interval | string]
            if item.health_check_interval is defined else [])
         + (['--health-check-path', item.health_check_path]
            if item.health_check_path is defined else [])
         + (['--comment', item.comment] if item.comment is defined else []) }}
  loop: "{{ _addon_sites_new }}"
  when:
    - addon.type == 'safeline'
    - _addon_state == 'present'

- name: Update the upstream of the changed protected sites
  ansible.builtin.command:
    argv:
      - "{{ pgcli_install_path }}"
      - "-c"
      - "{{ pgcli_config_path }}"
      - addon
      - safeline
      - site
      - update
      - "--name"
      - "{{ addon.name }}"
      - "--site-id"
      - "{{ item.site_id | string }}"
      - "--upstream"
      - "{{ item.upstream }}"
  loop: "{{ _addon_sites_moved }}"
  when:
    - addon.type == 'safeline'
    - _addon_state == 'present'

- name: Report the protected sites changes
  ansible.builtin.debug:
    msg: >-
      SafeLine sites on {{ addon.name }}: created
      [{{ _addon_sites_new | map(attribute='site_key') | join(', ') }}],
      updated the upstream of [{{ _addon_sites_moved | map(attribute='site_key') | join(', ') }}]
  when:
    - addon.type == 'safeline'
    - _addon_state == 'present'
    - (_addon_sites_new | length > 0) or (_addon_sites_moved | length > 0)

# The PEM files were only staged for `site create`, which uploaded them into
# the console; they are not needed afterwards.
- name: Remove the staged site certificates
  ansible.builtin.file:
    path: "{{ _addon_site_cert_dir }}"
    state: absent
  when: addon.type == 'safeline'

# autoreload runs on EVERY apply, not only when something above changed.
# SafeLine's tengine resolves site upstream host names when its config loads,
# so each deployment re-resolves them; reload is nginx -t plus a graceful
# tengine reload, so the stack keeps serving.
- name: Reload the add-on
  ansible.builtin.command:
    argv: "{{ [pgcli_install_path, '-c', pgcli_config_path, 'addon', 'reload', addon.type, '--name', addon.name] }}"
  when:
    - _addon_state == 'present'
    - _addon_cfg | length > 0
    - addon.autoreload | default(false) | bool

# A fresh etcd member returns from `addon install` before it can answer
# requests. The next host in this serial:1 play joins it, so wait here before
# the play advances.
- name: Resolve the etcd client port
  ansible.builtin.set_fact:
    _addon_etcd_port: >-
      {{ _addon_install_argv[_addon_install_argv.index('--client-port') + 1]
         if '--client-port' in _addon_install_argv else 2379 }}

- name: Wait for the etcd client port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ _addon_etcd_port }}"
    timeout: 60
  when:
    - addon.type == 'etcd'
    - _addon_state == 'present'

- name: Wait for etcd to answer requests
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ _addon_etcd_port }}/version"
    status_code: 200
  register: _addon_etcd_ready
  until: _addon_etcd_ready.status | default(0) == 200
  retries: 30
  delay: 1
  when:
    - addon.type == 'etcd'
    - _addon_state == 'present'

- name: Remove the add-on
  ansible.builtin.command:
    argv: "{{ [pgcli_install_path, '-c', pgcli_config_path, 'addon', 'remove', addon.type] + _addon_selector + (['--clean-data'] if addon.clean_data | default(true) else []) }}"
  when:
    - _addon_state == 'absent'
