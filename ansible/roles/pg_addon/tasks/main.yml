---
# SafeLine needs rootful podman (fixed bridge container addresses and
# host-network traffic proxies) and refuses rootless. When the selected add-on
# group is safeline, run its commands as root even if this host's deployment
# identity is rootless (for example a host that also belongs to an active
# scenario group), while the stack stays in the deployment account's pgcli
# config. A scenario group's own pgcli_addons list would otherwise shadow the
# --limit selection, so the safeline group list is selected explicitly.
- name: Note whether safeline overrides the deployment identity
  ansible.builtin.set_fact:
    _addon_safeline_rootful: >-
      {{ _addon_type == 'safeline' and (pgcli_deploy_rootless | bool) }}
    _addon_safeline_deploy_user: "{{ pgcli_deploy_user }}"
    _addon_safeline_deploy_home: "{{ pgcli_deploy_home }}"
    _addon_safeline_config_path: "{{ pgcli_config_path }}"

- name: Select the safeline add-on group over scenario-group add-on lists
  ansible.builtin.set_fact:
    pgcli_addons: "{{ lookup('vars', 'addon_' ~ _addon_kind ~ '_addons', default=[]) }}"
  when: _addon_type == 'safeline'

- name: Run safeline with rootful privileges
  ansible.builtin.set_fact:
    pgcli_deploy_rootless: false
    pgcli_deploy_become_user: root
    pgcli_deploy_home: "{{ _addon_safeline_deploy_home }}"
    pgcli_config_path: "{{ _addon_safeline_config_path }}"
  when: _addon_safeline_rootful | bool

- name: Show the safeline deployment notice
  ansible.builtin.debug:
    msg: >-
      SafeLine requires rootful podman: running the safeline commands as root
      (rootful podman) while keeping the stack in the deployment account's
      config {{ _addon_safeline_config_path }}.
  when: _addon_safeline_rootful | bool

- name: Read pgcli config
  ansible.builtin.command:
    argv:
      - "{{ pgcli_install_path }}"
      - "-c"
      - "{{ pgcli_config_path }}"
      - config
      - show
  register: pgcli_addon_config_raw
  changed_when: false

- name: Parse pgcli config
  ansible.builtin.set_fact:
    pgcli_cfg: "{{ pgcli_addon_config_raw.stdout | from_yaml }}"

# Like pgcli_instances, an entry may set host: <inventory host> to limit it to
# that host; entries without host run everywhere. Without the filter, a
# multi-host group (for example [rootless]) would try to pool an instance that
# only exists on the host that owns it.
- name: Reconcile add-ons
  ansible.builtin.include_tasks: addon.yml
  loop: >-
    {{ (pgcli_addons | selectattr('host', 'defined')
        | selectattr('host', 'equalto', inventory_hostname) | list)
       + (pgcli_addons | rejectattr('host', 'defined') | list) }}
  loop_control:
    loop_var: addon
    label: "{{ addon.type }}{{ ('/' + addon.name) if addon.name is defined else '' }}"

# The safeline commands run as root, so state files they create (or add-on conf
# files they write next to the config) would be root-owned. Hand the deployment
# account its pgcli state back, keeping the file modes pgcli set.
- name: Check the deployment account's pgcli state directory
  ansible.builtin.stat:
    path: "{{ _addon_safeline_config_path }}"
  register: _addon_safeline_cfg_stat
  when:
    - _addon_safeline_rootful | bool
    - _addon_safeline_deploy_user | length > 0

- name: Restore the deployment account's pgcli state ownership
  ansible.builtin.file:
    path: "{{ _addon_safeline_config_path | dirname }}"
    state: directory
    recurse: true
    owner: "{{ _addon_safeline_deploy_user }}"
    group: "{{ _addon_safeline_deploy_user }}"
  when:
    - _addon_safeline_rootful | bool
    - _addon_safeline_deploy_user | length > 0
    - _addon_safeline_cfg_stat.stat.exists | default(false)
