---
# SafeLine and K3s need rootful podman (fixed bridge container addresses /
# host-network privileged containers) and refuse rootless. When the selected
# add-on group is safeline or k3s, run its commands as root even if this
# host's deployment identity is rootless (for example a host that also belongs
# to an active scenario group), while the stack stays in the deployment
# account's pgcli config. A scenario group's own pgcli_addons list would
# otherwise shadow the --limit selection, so the add-on group list is selected
# explicitly.
- name: Note whether the add-on overrides the deployment identity
  ansible.builtin.set_fact:
    _addon_rootful_required: >-
      {{ _addon_type in ['safeline', 'k3s'] and (pgcli_deploy_rootless | bool) }}
    _addon_rootful_deploy_user: "{{ pgcli_deploy_user }}"
    _addon_rootful_deploy_home: "{{ pgcli_deploy_home }}"
    _addon_rootful_config_path: "{{ pgcli_config_path }}"

- name: Select the rootful add-on group over scenario-group add-on lists
  ansible.builtin.set_fact:
    pgcli_addons: "{{ lookup('vars', 'addon_' ~ _addon_kind ~ '_addons', default=[]) }}"
  when: _addon_type in ['safeline', 'k3s']

- name: Run the add-on with rootful privileges
  ansible.builtin.set_fact:
    pgcli_deploy_rootless: false
    pgcli_deploy_become_user: root
    pgcli_deploy_home: "{{ _addon_rootful_deploy_home }}"
    pgcli_config_path: "{{ _addon_rootful_config_path }}"
  when: _addon_rootful_required | bool

# Rootful podman must not inherit the deployment account's session bus.
- name: Drop the rootless runtime directory for rootful k3s
  ansible.builtin.set_fact:
    pgcli_deploy_run_dir: ""
  when:
    - _addon_rootful_required | bool
    - _addon_type == 'k3s'

- name: Show the rootful deployment notice
  ansible.builtin.debug:
    msg: >-
      {{ _addon_type }} requires rootful podman: running the {{ _addon_type }}
      commands as root (rootful podman) while keeping the stack in the
      deployment account's config {{ _addon_rootful_config_path }}.
  when: _addon_rootful_required | bool

- name: Ensure the pgcli config exists
  ansible.builtin.include_role:
    name: pgcli
    tasks_from: config
  # --tags addon may run on a host that never went through the pgcli role (a
  # fresh test VM) and no instance play will create the config there: create
  # it here so the add-on commands have one to write to. No-op when present.

- name: Read pgcli config
  ansible.builtin.command:
    argv:
      - "{{ pgcli_install_path }}"
      - "-c"
      - "{{ pgcli_config_path }}"
      - config
      - show
  register: pgcli_addon_config_raw
  changed_when: false

- name: Parse pgcli config
  ansible.builtin.set_fact:
    pgcli_cfg: "{{ pgcli_addon_config_raw.stdout | from_yaml }}"

# Like pgcli_instances, an entry may set host: <inventory host> to limit it to
# that host; entries without host run everywhere. Without the filter, a
# multi-host group (for example [rootless]) would try to pool an instance that
# only exists on the host that owns it.
- name: Reconcile add-ons
  ansible.builtin.include_tasks: addon.yml
  loop: >-
    {{ (pgcli_addons | selectattr('host', 'defined')
        | selectattr('host', 'equalto', inventory_hostname) | list)
       + (pgcli_addons | rejectattr('host', 'defined') | list) }}
  loop_control:
    loop_var: addon
    label: "{{ addon.type }}{{ ('/' + addon.name) if addon.name is defined else '' }}"

# The add-on commands run as root, so state files they create (or add-on conf
# files they write next to the config) would be root-owned. Hand the deployment
# account its pgcli state back, keeping the file modes pgcli set.
- name: Check the deployment account's pgcli state directory
  ansible.builtin.stat:
    path: "{{ _addon_rootful_config_path }}"
  register: _addon_rootful_cfg_stat
  when:
    - _addon_rootful_required | bool
    - _addon_rootful_deploy_user | length > 0

- name: Restore the deployment account's pgcli state ownership
  ansible.builtin.file:
    path: "{{ _addon_rootful_config_path | dirname }}"
    state: directory
    recurse: true
    owner: "{{ _addon_rootful_deploy_user }}"
    group: "{{ _addon_rootful_deploy_user }}"
  when:
    - _addon_rootful_required | bool
    - _addon_rootful_deploy_user | length > 0
    - _addon_rootful_cfg_stat.stat.exists | default(false)
