sections: [hero, cards, cta]

hero:
  align: center
  eyebrow: PostgreSQL instance manager
  title_lines:
    - words: [{ text: pgcli }]
    - words: [{ text: Simplify PostgreSQL management }]
  lead: Using PostgreSQL databases as naturally as breathing. One command to create, manage, backup, clone, and replicate with isolated containers.
  actions:
    - { label: Read the docs, url: docs/, icon: fa-solid fa-book, style: primary }
    - { label: Quick start, url: docs/quickstart/, icon: fa-solid fa-rocket, style: ghost }

cards:
  eyebrow: Key features
  title: Everything you need
  columns: 3
  items:
    - title: Instance Management
      desc: Create, start, stop, and destroy isolated PostgreSQL instances with one command.
      icon: fa-solid fa-database
      url: docs/quickstart/
    - title: Backup
      desc: Full, differential, and incremental snapshots with pgBackRest and a shared backup container.
      icon: fa-solid fa-shield-halved
      url: docs/backup/
    - title: Restore
      desc: Point-in-time recovery (PITR) to any moment after your first backup, with dry-run preview.
      icon: fa-solid fa-clock-rotate-left
      url: docs/restore/
    - title: Replication
      desc: Create read-only replicas with WAL streaming, automatic slot management, and cascading replication.
      icon: fa-solid fa-arrows-turn-to-dots
      url: docs/replica/
    - title: Failover
      desc: 3-step manual failover — promote a replica, clean up the old primary, and repoint remaining replicas.
      icon: fa-solid fa-triangle-exclamation
      url: docs/failover/
    - title: Extensions
      desc: Install and manage 440+ PostgreSQL extensions from the Pigsty catalog, baked into container images.
      icon: fa-solid fa-puzzle-piece
      url: docs/extensions/
    - title: Clone
      desc: Stream-clone an instance or remote database into a new instance with no temporary files on disk.
      icon: fa-solid fa-clone
      url: docs/clone/
    - title: Import & Export
      desc: Export and import databases in custom or SQL format, with gzip compression and piping between instances.
      icon: fa-solid fa-file-arrow-down
      url: docs/import-export/
    - title: Exec & psql
      desc: Run SQL, container commands, or interactive psql sessions — locally or against remote databases via DSN.
      icon: fa-solid fa-terminal
      url: docs/exec-psql/
    - title: Administration
      desc: Shell completion, config management, PostgreSQL tuning, and instance rebuild for a fresh start.
      icon: fa-solid fa-gear
      url: docs/administration/

cta:
  title: Ready to get started?
  text: Install pgcli and create your first PostgreSQL instance in minutes.
  label: Installation guide
  url: docs/quickstart/
  style: primary
