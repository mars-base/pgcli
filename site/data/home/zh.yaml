sections: [hero, cards, cta]

hero:
  align: center
  eyebrow: PostgreSQL 实例管理器
  title_lines:
    - words: [{ text: pgcli }]
    - words: [{ text: 简化 PostgreSQL 管理 }]
  lead: 让使用 PostgreSQL 数据库像呼吸一样简单自然。一个命令即可创建、管理、备份、克隆和复制，使用隔离容器。
  actions:
    - { label: 阅读文档, url: docs/, icon: fa-solid fa-book, style: primary }
    - { label: 快速开始, url: docs/quickstart/, icon: fa-solid fa-rocket, style: ghost }

cards:
  eyebrow: 核心功能
  title: 你需要的一切
  columns: 3
  items:
    - title: 实例管理
      desc: 一个命令创建、启动、停止和销毁隔离的 PostgreSQL 实例。
      icon: fa-solid fa-database
      url: docs/quickstart/
    - title: 备份与 PITR
      desc: 使用 pgBackRest 进行全量、差异和增量快照，并可恢复到快照之后的任意时刻。
      icon: fa-solid fa-shield-halved
      url: docs/backup/
    - title: 复制与故障转移
      desc: WAL 流式复制的只读副本，支持级联复制；主实例失联时提升副本接管。
      icon: fa-solid fa-arrows-turn-to-dots
      url: docs/replica/
    - title: HA 集群
      desc: Patroni 高可用——自动故障切换、DCS 驱动的集群、跨主机成员、集群 PITR 与直连 SQL。
      icon: fa-solid fa-sitemap
      url: docs/ha-cluster/
    - title: 插件
      desc: 围绕实例或集群的一条命令配套容器：pgbouncer、PgDog、etcd、HAProxy 与 MinIO。
      icon: fa-solid fa-cubes
      url: docs/addon/
    - title: 扩展
      desc: 从 Pigsty 目录安装和管理 440+ PostgreSQL 扩展，烘焙到容器镜像中。
      icon: fa-solid fa-puzzle-piece
      url: docs/extensions/

cta:
  title: 准备好开始了吗？
  text: 安装 pgcli，几分钟内创建你的第一个 PostgreSQL 实例。
  label: 安装指南
  url: docs/quickstart/
  style: primary
